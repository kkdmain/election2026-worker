/* ============== ADMIN SOCIAL CARDS PAGE ============== */
function AdminSocialCards({ constituencies, candidates, segments, onToast }) {
  const TPL = [
    { id:'lead',     label:'CONSTITUENCY LEAD',    size:'1080 × 1350', use:'Single constituency — 3-party comparison with photo, votes & lead (DIO Poster style)' },
    { id:'allcons',  label:'ALL CONSTITUENCY LEADS', size:'2400 × 3000', use:'All 13 constituencies candidate lead grid (uploaded SM Template design)' },
    { id:'round',    label:'ROUND UPDATE',          size:'1080 × 1920 (Story)', use:'Quick round completion update with large lead number' },
    { id:'district', label:'DISTRICT LEADERBOARD',  size:'1080 × 1080', use:'Seat tally + vote totals for all parties' },
    { id:'margin',   label:'DISTRICT VOTE MARGIN',  size:'1080 × 1080', use:'Overall vote lead comparison across constituencies' },
  ];
  const [tpl, setTpl] = useState('lead');
  const [consId, setConsId] = useState(constituencies[0]?.id);
  const cons = constituencies.find(c => c.id === consId) || constituencies[0];
  const time = useClock();
  const previewRef = useRef(null);
  const [busy, setBusy] = useState(false);

  const renderCard = () => {
    if (tpl==='lead')     return html`<${LeadCardSVG} cons=${cons} candidates=${candidates} constituencies=${constituencies} time=${time}/>`;
    if (tpl==='allcons')  return html`<${CandidateCardSVG} constituencies=${constituencies} candidates=${candidates} time=${time}/>`;
    if (tpl==='round')    return html`<${RoundCardSVG} cons=${cons} candidates=${candidates} time=${time}/>`;
    if (tpl==='district') return html`<${DistrictCardSVG} constituencies=${constituencies} candidates=${candidates} time=${time}/>`;
    if (tpl==='margin')   return html`<${MarginCardSVG} constituencies=${constituencies} candidates=${candidates} time=${time}/>`;
    return null;
  };

  const sizeMap = { lead:[1080,1350], allcons:[2400,3000], round:[1080,1920], district:[1080,1080], margin:[1080,1080] };

  const downloadJpg = async () => {
    const node = previewRef.current;
    if (!node) return;
    const svg = node.querySelector('svg');
    if (!svg) { onToast('Render first', 'err'); return; }
    setBusy(true);
    try {
      const [W, H] = sizeMap[tpl];

      // Clone SVG and embed Google Fonts
      const clone = svg.cloneNode(true);
      clone.setAttribute('width', W);
      clone.setAttribute('height', H);
      // Inject font @import to the svg defs so canvas can find them
      const styleEl = document.createElementNS('http://www.w3.org/2000/svg','style');
      styleEl.textContent = '';
      const defs = clone.querySelector('defs') || (() => { const d = document.createElementNS('http://www.w3.org/2000/svg','defs'); clone.insertBefore(d, clone.firstChild); return d; })();
      defs.appendChild(styleEl);

      const xml = new XMLSerializer().serializeToString(clone);
      const svgStr = '<?xml version="1.0" standalone="no"?>\r\n' + xml;
      const url = URL.createObjectURL(new Blob([svgStr], { type:'image/svg+xml;charset=utf-8' }));

      const img = new Image();
      img.crossOrigin = 'anonymous';
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a1340'; ctx.fillRect(0, 0, W, H);

      await new Promise((res, rej) => {
        img.onload = () => res();
        img.onerror = (e) => rej(e);
        img.src = url;
      });

      // wait extra moment for fonts to render in image
      await new Promise(r => setTimeout(r, 300));
      ctx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);

      const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.95));
      const dlUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = `dio-kozhikode-${tpl}-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(dlUrl), 100);
      onToast('JPG ഡൗൺലോഡ് ചെയ്തു');
    } catch (e) {
      console.error(e);
      onToast('ഡൗൺലോഡ് പരാജയപ്പെട്ടു', 'err');
    } finally {
      setBusy(false);
    }
  };

  const showCons = tpl === 'lead' || tpl === 'round';

  return html`<div class="sc-stage">
    <div>
      <div class="sc-tabs">
        ${TPL.map(t => html`<button key=${t.id} class=${`sc-tab ${tpl===t.id?'on':''}`} onClick=${() => setTpl(t.id)}>${t.label}</button>`)}
      </div>
      <div class="sc-preview" ref=${previewRef}>
        ${renderCard()}
      </div>
    </div>
    <div>
      <div class="sc-info">
        <b>Template</b><span>${TPL.find(t => t.id===tpl)?.label}</span>
        <b>Size</b><span>${TPL.find(t => t.id===tpl)?.size}</span>
        <b>Use Case</b><span>${TPL.find(t => t.id===tpl)?.use}</span>
        <b>Format</b><span>JPG (image/jpeg, q=0.95)</span>
      </div>
      ${showCons && html`<div class="adm-card" style="margin-bottom:14px">
        <div class="adm-fld">
          <label>Constituency for this card</label>
          <select class="adm-inp" value=${consId} onChange=${e => setConsId(e.target.value)}>
            ${constituencies.map(c => html`<option key=${c.id} value=${c.id}>${c.name_en || c.en} · ${c.name_ml || c.ml}</option>`)}
          </select>
        </div>
      </div>`}
      <div class="sc-actions">
        <button class="adm-btn primary" style="justify-content:center;padding:14px" onClick=${downloadJpg} disabled=${busy}>
          <${Icon} d=${I.dl} size=${14}/> ${busy ? 'Generating JPG...' : 'Download JPG'}
        </button>
        <div style="font-family:'Anek Malayalam',sans-serif;font-size:11px;color:rgba(255,255,255,.5);text-align:center;line-height:1.6">
          ഫോൺ്റ്റ് എംബെഡിംഗും ലൈവ് ഡാറ്റയും ഉള്ള ഉയർന്ന നിലവാരമുള്ള JPG. <br/>Instagram, Facebook, Twitter, WhatsApp, Telegram എന്നിവയ്ക്ക് അനുയോജ്യം.
        </div>
      </div>
    </div>
  </div>`;
}

/* ====================================================================
   APP — top-level state, login flow, splash, dashboard ↔ admin
   ==================================================================== */
function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [dbLoading, setDbLoading] = useState(true);
  const cachedDb = useMemo(() => loadDbCache(), []);
  const [user, setUser] = useState(() => {
    try { const s = localStorage.getItem('dio_session_v3'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  });
  const [showAdmin, setShowAdmin] = useState(false);
  const [updateOverlay, setUpdateOverlay] = useState(null);
  const [toasts, setToasts] = useState([]);

  // data lives in Supabase; the HTML starts empty and fills from DB.
  const [constituencies, setConstituencies] = useState(() => cachedDb?.constituencies || []);
  const [candidates, setCandidates] = useState(() => cachedDb?.candidates || []);
  const [segments, setSegments] = useState(() => cachedDb?.segments || []);
  const [ticker, setTicker] = useState(() => cachedDb?.ticker || []);
  const [announcements, setAnnouncements] = useState(() => cachedDb?.announcements || []);
  const [users, setUsers] = useState(() => cachedDb?.users || []);
  const [settings, setSettings] = useState(() => cachedDb?.settings || DEFAULT_SETTINGS);

  // Bootstrap: load everything from Supabase on first render
  const [rawRoundRows, setRawRoundRows] = useState(() => []);
  const rawRoundRowsRef = useRef([]);
  const updateRawRoundRows = (nextRowsOrUpdater) => {
    setRawRoundRows(prev => {
      const next = typeof nextRowsOrUpdater === 'function' ? nextRowsOrUpdater(prev) : nextRowsOrUpdater;
      rawRoundRowsRef.current = next || [];
      return next || [];
    });
  };
  const applyDbSnapshot = useCallback(async (db, cancelledRef={ current:false }) => {
    if (!db || cancelledRef.current) return;
    setConstituencies(db.constituencies || []);
    setCandidates(db.candidates || []);
    setTicker(db.ticker || []);
    setAnnouncements(db.announcements || []);
    if (db.rawRoundRows) updateRawRoundRows(db.rawRoundRows);
    if (db.settings) setSettings(db.settings);

    if (db._phase2) {
      const [segRows, userRows, imageRows] = await db._phase2;
      if (cancelledRef.current) return;
      const nextSegments = (segRows || []).map(dbToSegment);
      const nextUsers = (userRows || []).map(dbToUser);
      const imageCandidates = hydrateCandidateImages(db.candidates, imageRows);
      setSegments(nextSegments);
      setUsers(nextUsers);
      setCandidates(imageCandidates);
      saveDbCache({
        constituencies: db.constituencies,
        candidates: imageCandidates,
        segments: nextSegments,
        ticker: db.ticker,
        announcements: db.announcements,
        users: nextUsers,
        settings: db.settings,
      });
    }
  }, []);

  useEffect(() => {
    const cancelledRef = { current:false };
    if (cachedDb) setDbLoading(false);
    loadAllFromDB().then(db => {
      if (cancelledRef.current) return;
      if (db) {
        applyDbSnapshot(db, cancelledRef);
        if (!db.settings) supaUpsert('app_settings', settingsToDb(DEFAULT_SETTINGS));
      }
      setDbLoading(false);
    }).catch(() => setDbLoading(false));
    return () => { cancelledRef.current = true; };
  }, [applyDbSnapshot]);

  // Poll every 30 seconds so other-device vote updates appear even when
  // Supabase realtime is unavailable or not enabled on the current database.
  useEffect(() => {
    if (!supa) return;
    const cancelledRef = { current:false };
    let running = false;
    const refreshFromDB = async () => {
      if (running) return;
      running = true;
      try {
        const db = await loadAllFromDB();
        if (db) await applyDbSnapshot(db, cancelledRef);
      } catch (e) {
        console.warn('30s DB poll failed', e);
      } finally {
        running = false;
      }
    };
    const pollTimer = setInterval(refreshFromDB, 30000);
    const onVisibilityChange = () => {
      if (document.visibilityState === 'visible') refreshFromDB();
    };
    document.addEventListener('visibilitychange', onVisibilityChange);
    return () => {
      cancelledRef.current = true;
      clearInterval(pollTimer);
      document.removeEventListener('visibilitychange', onVisibilityChange);
    };
  }, [applyDbSnapshot]);

  useEffect(() => {
    if (dbLoading || !user) return;
    const fresh = users.find(u => u.id === user.id && u.active);
    if (fresh) {
      setUser(fresh);
      try { localStorage.setItem('dio_session_v3', JSON.stringify(fresh)); } catch(e) {}
    } else {
      try { localStorage.removeItem('dio_session_v3'); } catch(e) {}
      setUser(null);
    }
  }, [dbLoading, users]);

  // When rawRoundRows are patched by realtime, rebuild candidate vote totals without a DB fetch
  useEffect(() => {
    setCandidates(prev => {
      if (!prev.length) return prev;
      const roundByCandidate = new Map();
      rawRoundRows.forEach(r => {
        const arr = roundByCandidate.get(r.candidate_id);
        if (arr) arr.push(r); else roundByCandidate.set(r.candidate_id, [r]);
      });
      return prev.map(c => {
        const myRows = roundByCandidate.get(c.id) || [];
        const myRounds = myRows.filter(r => r.round_number > 0);
        const postal = myRows.find(r => r.round_number === 0);
        const rounds = {};
        myRounds.forEach(r => { rounds[r.round_number] = r.votes; });
        const postalVotes = postal?.votes ?? 0;
        const totalVotes = myRounds.reduce((s, r) => s + r.votes, 0) + postalVotes;
        return { ...c, votes: totalVotes, postalVotes, rounds };
      });
    });
  }, [rawRoundRows]);

  // Realtime subscriptions — patch in-memory state instead of full re-fetches
  useEffect(() => {
    if (!supa) return;
    const timers = new Map();
    const debounce = (key, fn, delay=250) => {
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => { timers.delete(key); fn(); }, delay));
    };

    // Helper: rebuild candidates from current rawRoundRows + a patched version of one row
    const patchRoundRow = (payload) => {
      updateRawRoundRows(prev => {
        const next = [...prev];
        const { candidate_id, round_number } = payload.new || payload.old || {};
        if (!candidate_id) return prev;
        const idx = next.findIndex(r => r.candidate_id === candidate_id && r.round_number === round_number);
        if (payload.eventType === 'DELETE') {
          if (idx >= 0) next.splice(idx, 1);
        } else {
          if (idx >= 0) next[idx] = payload.new;
          else next.push(payload.new);
        }
        // Rebuild candidates from the updated round rows
        // We do this inside the setter to avoid stale closure issues
        return next;
      });
    };

    const ch = supa.channel('dio-live')
      // Constituencies: small table, safe to re-fetch
      .on('postgres_changes', { event: '*', schema: 'public', table: 'constituencies' }, (payload) => {
        if (payload.eventType === 'UPDATE' || payload.eventType === 'INSERT') {
          setConstituencies(prev => {
            const next = [...prev];
            const idx = next.findIndex(c => c.id === payload.new.id);
            const updated = dbToConstituency(payload.new);
            if (idx >= 0) next[idx] = updated; else next.push(updated);
            return next;
          });
        } else if (payload.eventType === 'DELETE') {
          setConstituencies(prev => prev.filter(c => c.id !== payload.old.id));
        }
      })
      // Candidates: patch individual candidate metadata
      .on('postgres_changes', { event: '*', schema: 'public', table: 'candidates' }, (payload) => {
        if (payload.eventType === 'DELETE') {
          setCandidates(prev => prev.filter(c => c.id !== payload.old.id));
        } else {
          // UPDATE or INSERT
          const updatedRow = payload.new;
          setCandidates(prev => {
            const next = [...prev];
            const idx = next.findIndex(c => c.id === updatedRow.id);
            // Get round rows specifically for this candidate to calculate totals
            const myRows = rawRoundRowsRef.current.filter(r => r.candidate_id === updatedRow.id);
            const updatedCand = dbToCandidate(updatedRow, myRows);
            if (idx >= 0) {
              // Preserve existing photoUrl/symbolUrl if not provided in payload
              updatedCand.photoUrl = updatedRow.photo_url ? safeImageUrl(updatedRow.photo_url) : (prev[idx].photoUrl || updatedCand.photoUrl);
              updatedCand.symbolUrl = updatedRow.symbol_url ? safeImageUrl(updatedRow.symbol_url) : (prev[idx].symbolUrl || updatedCand.symbolUrl);
              next[idx] = updatedCand;
            } else {
              next.push(updatedCand);
            }
            return next;
          });
        }
      })
      // Round votes: patch in-memory — NO full re-fetch
      .on('postgres_changes', { event: '*', schema: 'public', table: 'candidate_round_votes' }, (payload) => {
        patchRoundRow(payload);
      })
      // LAC segments: moderate size, debounced re-fetch
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lac_segments' }, (payload) => {
        if (payload.eventType === 'UPDATE' || payload.eventType === 'INSERT') {
          setSegments(prev => {
            const next = [...prev];
            const idx = next.findIndex(s => s.id === payload.new.id);
            const updated = dbToSegment(payload.new);
            if (idx >= 0) next[idx] = updated; else next.push(updated);
            return next;
          });
        } else if (payload.eventType === 'DELETE') {
          setSegments(prev => prev.filter(s => s.id !== payload.old.id));
        }
      })
      // Ticker: tiny table
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ticker_messages' }, () => {
        debounce('ticker', async () => {
          const rows = await supaLoadSorted('ticker_messages', 'sort_order', true);
          if (rows) setTicker(rows.map(r => r.message));
        }, 300);
      })
      // Announcements: tiny table
      .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => {
        debounce('announcements', async () => {
          const rows = await supaLoadSorted('announcements', 'sort_order', true);
          if (rows) setAnnouncements(rows.map(r => ({ id: r.id, kind: r.kind || 1, msg: r.message, tag: r.tag || 'BREAKING' })));
        }, 300);
      })
      // Users: admin-only concern, low frequency
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_users' }, () => {
        debounce('users', async () => {
          const data = await supaLoad('app_users');
          if (data) setUsers(data.map(dbToUser));
        }, 500);
      })
      // Settings: single row, rare changes
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, (payload) => {
        if (payload.new) setSettings(dbToSettings(payload.new));
        else debounce('settings', async () => {
          const rows = await supaLoad('app_settings');
          if (rows && rows[0]) setSettings(dbToSettings(rows[0]));
        }, 300);
      })
      .subscribe();

    return () => {
      timers.forEach(t => clearTimeout(t));
      supa.removeChannel(ch);
    };
  }, []);



  useEffect(() => {
    const t = setTimeout(() => setShowSplash(false), cachedDb ? 700 : 1700);
    return () => clearTimeout(t);
  }, [cachedDb]);

  const onToast = (msg, kind='ok') => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, msg, kind }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 2400);
  };

  const onLogin = (u) => {
    setUser(u);
    try { localStorage.setItem('dio_session_v3', JSON.stringify(u)); } catch(e) {}
    onToast(`സ്വാഗതം, ${u.name}`);
  };
  const onLogout = () => {
    try { localStorage.removeItem('dio_session_v3'); } catch(e) {}
    setUser(null);
    setShowAdmin(false);
    onToast('ലോഗ്ഔട്ട് ചെയ്തു');
  };

  const onPublish = (target) => {
    setUpdateOverlay({ target });
  };

  const tally = useMemo(() => seatTallyFrom(constituencies, candidates), [constituencies, candidates]);
  const totals = useMemo(() => totalsFrom(candidates), [candidates]);
  const totalSeats = constituencies.length;
  const totalCounted = (totals.UDF||0) + (totals.LDF||0) + (totals.NDA||0) + (totals.OTH||0);
  /* Find party-wise lead = winner_party total - runner_party total (district-wide) */
  const _sortedTotals = ['UDF','LDF','NDA','OTH'].map(p => ({p, v: totals[p]||0})).sort((a,b) => b.v - a.v);
  const totalLead = (_sortedTotals[0]?.v || 0) - (_sortedTotals[1]?.v || 0);
  const leadParty = _sortedTotals[0]?.p || 'UDF';
  const completedRounds = constituencies.reduce((s,c) => s + (c.completedRounds||c.round||0), 0);
  const totalRoundsAll = constituencies.reduce((s,c) => s + (c.totalRounds||c.total||15), 0);
  /* Polling statistics: 25.6 lakh registered voters in Kozhikode district approx; we'll compute % polled and remaining to count */
  const pollStats = useMemo(() => {
    const lacPolled = Object.values(settings.votersPolledByCons || {}).reduce((s,v) => s + (parseInt(v,10)||0), 0);
    const totalVotersPolled = lacPolled || settings.totalVotersPolled || 0;  /* configured voters polled */
    const counted = totalCounted;
    const remaining = Math.max(0, totalVotersPolled - counted);
    const pct = totalVotersPolled > 0 ? (counted / totalVotersPolled * 100) : 0;
    return { polled: totalVotersPolled, counted, remaining, pct };
  }, [totalCounted, settings.totalVotersPolled, settings.votersPolledByCons]);

  if (showSplash) return html`<${Splash}/>`;
  if (!user) return html`<${LoginScreen} users=${users} onLogin=${onLogin} dbLoading=${dbLoading}/>`;

  return html`<div class="dash">
    <${Header}/>
    <div class="main">
      <div class="col col-l">
        <${SeatTally} tally=${tally} total=${totalSeats}/>
        <${CountingProgress} completedRounds=${completedRounds} totalRoundsAll=${totalRoundsAll}/>
        <${AnalyticsFlash} totals=${totals} totalLead=${totalLead} leadParty=${leadParty} segments=${segments} constituencies=${constituencies} candidates=${candidates}/>
      </div>
      <div class="col col-c">
        <${LeadingCandidates} candidates=${candidates} constituencies=${constituencies}/>
        <${RoundWiseFlash} candidates=${candidates} constituencies=${constituencies} segments=${segments}/>
      </div>
      <div class="col col-r">
        <${BreakingFlash} items=${announcements}/>
        <${ConstituencyFlash} candidates=${candidates} constituencies=${constituencies}/>
      </div>
    </div>
    <${Ticker} messages=${ticker}/>

    <button class="fab" title="Admin Panel" onClick=${() => setShowAdmin(true)}>
      <${Icon} d=${I.set} size=${22}/>
    </button>

    ${showAdmin && html`<${AdminPanel}
      user=${user}
      onClose=${() => setShowAdmin(false)}
      onLogout=${onLogout}
      onPublish=${onPublish}
      onToast=${onToast}
      constituencies=${constituencies} setConstituencies=${setConstituencies}
      candidates=${candidates} setCandidates=${setCandidates}
      segments=${segments} setSegments=${setSegments}
      ticker=${ticker} setTicker=${setTicker}
      announcements=${announcements} setAnnouncements=${setAnnouncements}
      users=${users} setUsers=${setUsers}
      settings=${settings} setSettings=${setSettings}
      setRawRoundRows=${updateRawRoundRows}
    />`}

    ${updateOverlay && html`<${UpdateOverlay}
      target=${updateOverlay.target}
      onDone=${() => setUpdateOverlay(null)}
    />`}

    ${toasts.map(t => html`<div key=${t.id} class=${`toast ${t.kind==='err'?'err':''}`}>${t.msg}</div>`)}
  </div>`;
}

/* Render */
render(h(App), document.getElementById('root'));

</script>
</body>
</html>

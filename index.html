/* ====================================================================
   ROUND-WISE PARTY COUNT FLASH (center-bottom)
   compact non-scrolling replacement for constituency status table
   ==================================================================== */
function RoundWiseFlash({ candidates, constituencies, segments }) {
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  const per = 1;
  const pages = Math.max(1, Math.ceil(constituencies.length / per));
  useEffect(() => {
    if (paused || pages < 2) return;
    const t = setInterval(() => setIdx(i => (i+1)%pages), 6500);
    return () => clearInterval(t);
  }, [paused, pages]);
  const shown = constituencies.slice((idx%pages)*per, (idx%pages)*per + per);
  const pageLabels = constituencies.map(c => c.name_ml || c.name_en || c.id || '');
  const rowFor = (cons) => {
    const seg = segments.find(s => s.id === cons.id);
    const parties = ['UDF','LDF','NDA','OTH'];
    const roundCount = cons.totalRounds || cons.total || 15;
    const rounds = Array.from({length:roundCount}, (_,i) => i + 1).map(r => {
      const byParty = {};
      parties.forEach(p => {
        byParty[p] = seg?.rounds?.[r]?.[p] ?? candidates
          .filter(c => c.consId===cons.id && c.party===p)
          .reduce((s,c) => s + (parseInt(c.rounds?.[r],10)||0), 0);
      });
      return { round:r, byParty, counted: r <= (cons.completedRounds||cons.round||0) };
    });
    const hasSegmentRounds = !!seg && Object.keys(seg.rounds || {}).length > 0;
    const cum = parties.reduce((o,p) => {
      const fromVisibleRounds = rounds.reduce((s,r) => s + (r.counted ? (parseInt(r.byParty[p],10)||0) : 0), 0);
      const fromCandidates = candidates.filter(c => c.consId===cons.id && c.party===p).reduce((s,c)=>s+(parseInt(c.votes,10)||0),0);
      return { ...o, [p]: hasSegmentRounds ? fromVisibleRounds : fromCandidates };
    }, {});
    const postal = parties.reduce((o,p) => ({ ...o, [p]: candidates.filter(c => c.consId===cons.id && c.party===p).reduce((s,c)=>s+(parseInt(c.postalVotes,10)||0),0) }), {});
    return { seg, rounds, cum, postal };
  };
  return html`<div class="panel roundflash">
    <div class="panel-h">
      <div class="panel-t">റൗണ്ട് തിരിച്ചുള്ള കക്ഷി വോട്ട് · PARTY ROUND COUNT</div>
      <${FlashControls} count=${pages} idx=${idx} paused=${paused} onToggle=${() => setPaused(p => !p)} onSeek=${setIdx} labels=${pageLabels}/>
    </div>
    <div class="round-stage">
      ${shown.map(cons => {
        const d = rowFor(cons);
        const done = (cons.completedRounds||cons.round||0) >= (cons.totalRounds||cons.total||15);
        const st = COUNTING_STATUSES.find(s => s.val === (cons.countingStatus || 'live')) || COUNTING_STATUSES[1];
        const total = ['UDF','LDF','NDA','OTH'].reduce((s,p) => s + (d.cum[p]||0) + (d.postal[p]||0), 0);
        return html`<div class="round-card" key=${cons.id}>
          <div class="round-title">
            <div>
              <div class="round-cons-ml">${cons.name_ml}</div>
              <div class="round-cons-en">${cons.name_en} · R ${pad2N(cons.completedRounds||cons.round||0)}/${pad2N(cons.totalRounds||cons.total||15)}</div>
            </div>
            <span class=${`status-pill ${st.val==='live'&&!done?'live':'done'}`} style=${`color:${st.color};border-color:${st.color}66;background:${st.color}1a`}>${st.en.toUpperCase()}</span>
          </div>
          <div class="round-layout">
            <div class="round-rounds">
              <table class="round-table">
                <thead><tr><th>Party</th><th class="postal-col">POSTAL</th>${d.rounds.map(r => html`<th class=${r.round===(cons.completedRounds||cons.round||0)?'cur':''} key=${r.round}>R${pad2N(r.round)}</th>`)}</tr></thead>
                <tbody>
                  ${['UDF','LDF','NDA','OTH'].map(p => html`<tr class="done" key=${p}>
                    <td class="party-cell" style=${`--pc:${PARTIES[p].color}`}>${p}</td>
                    <td class="postal-col">${fmtIN(d.postal[p]||0)}</td>
                    ${d.rounds.map(r => html`<td class=${r.round===(cons.completedRounds||cons.round||0)?'cur':''} key=${r.round}>${r.counted ? fmtIN(r.byParty[p]||0) : '—'}</td>`)}
                  </tr>`)}
                </tbody>
              </table>
            </div>
            <div class="round-side">
              <div class="round-side-main">
                <div class="round-side-title">ക്യൂമുലേറ്റീവ് · CUMULATIVE</div>
                <div class="round-side-grid">
                  ${['UDF','LDF','NDA','OTH'].map(p => {
                    const cand = candidates
                      .filter(c => c.consId === cons.id && c.party === p)
                      .sort((a,b) => (b.votes||0) - (a.votes||0))[0];
                    const candName = cand?.name_ml || cand?.name || p;
                    return html`<div class="round-party" style=${`--pc:${PARTIES[p].color}`} key=${p}>
                      <div class="round-party-head">
                        <span class="round-party-meta">
                          <span class="round-party-k">${candName}</span>
                          <span class="round-party-s">${PARTIES[p].name || PARTIES[p].en || p} · ${p}</span>
                        </span>
                        <span class="round-party-v">${fmtIN(d.cum[p]||0)}</span>
                      </div>
                    </div>`;
                  })}
                </div>
              </div>
              <div class="round-total-line"><span>ആകെ എണ്ണിയത്</span><b>${fmtIN(total)}</b></div>
            </div>
          </div>
        </div>`;
      })}
    </div>
  </div>`;
}

/* ====================================================================
   CONSTITUENCY FLASH (right column) — rotates each constituency every 7s
   shows top 3 candidates with photos and per-constituency vote share
   ==================================================================== */
function ConstituencyFlash({ candidates, constituencies }) {
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || constituencies.length < 2) return;
    const t = setInterval(() => setIdx(i => (i+1) % constituencies.length), 7000);
    return () => clearInterval(t);
  }, [paused, constituencies.length]);
  const activeIdx = constituencies.length ? idx % constituencies.length : 0;
  const cons = constituencies[activeIdx];
  if (!cons) return null;
  const cands = candidates.filter(k => k.consId === cons.id).sort((a,b) => b.votes - a.votes).slice(0, 3);
  const total = cands.reduce((s,c) => s + (c.votes||0), 0) || 1;
  const leader = cands[0];
  const margin = leader && cands[1] ? leader.votes - cands[1].votes : 0;
  const done = (cons.completedRounds||cons.round||0) >= (cons.totalRounds||cons.total||15);
  const st = COUNTING_STATUSES.find(s => s.val === (cons.countingStatus || 'live')) || COUNTING_STATUSES[1];
  const labels = constituencies.map((c, i) => c.name_ml || c.name_en || `Constituency ${i+1}`);
  return html`<div class="panel cflash">
    <div class="panel-h">
      <div class="panel-t">മണ്ഡല സ്ഥാനാർത്ഥികൾ · CANDIDATES</div>
      <div style="display:flex;align-items:center;gap:6px">
        <${FlashControls} count=${constituencies.length} idx=${idx} paused=${paused} onToggle=${() => setPaused(p => !p)} onSeek=${setIdx} labels=${labels}/>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#fbbf24">${pad2N(activeIdx+1)} / ${pad2N(constituencies.length)}</span>
      </div>
    </div>
    <div class="cflash-stage" key=${cons.id}>
      <div class="cflash-head">
        <div class="cflash-cons-ml">${cons.name_ml}</div>
        <div class="cflash-cons-en">${cons.name_en} · റൗണ്ട് ${pad2N(cons.completedRounds||cons.round||0)}/${pad2N(cons.totalRounds||cons.total||15)} · <span style=${`color:${st.color};${st.val==='live'&&!done?'animation:blink 1s ease infinite':''}`}>${st.en.toUpperCase()}</span></div>
      </div>
      <div class="cflash-cards">
        ${cands.map((c,i) => {
          const share = (c.votes / total) * 100;
          const partyColor = PARTIES[c.party]?.color || '#fbbf24';
          const isLeader = i === 0;
          return html`<div class=${`cflash-card ${isLeader?'is-lead':''}`} key=${c.id} style=${`--pc:${partyColor}`}>
            <div class="cflash-rank">${i+1}</div>
            <div class="cflash-photo"><${Avatar} size=${44} party=${c.party} seed=${c.photoSeed||c.id} ring=${true} photoUrl=${c.photoUrl||''}/></div>
            <div class="cflash-body">
              <div class="cflash-name">${c.name_ml || c.name}</div>
              <div class="cflash-pty"><span class=${`pty-pill ${c.party.toLowerCase()}`} style="font-size:9px;padding:1px 6px">${PARTIES[c.party]?.en}</span><span class="cflash-pty-sub">${PARTIES[c.party]?.sub||''}</span></div>
              <div class="cflash-bar"><div class="cflash-bar-fill" style=${`width:${share}%;background:${partyColor}`}></div></div>
            </div>
            <div class="cflash-num">
              <div class="cflash-votes" style=${`color:${partyColor}`}>${fmtIN(c.votes)}</div>
              ${isLeader && cands.length > 1 ? html`<div class="cflash-lead-inline">+${fmtIN(margin)}</div>` : html`<div class="cflash-share">${share.toFixed(1)}%</div>`}
            </div>
          </div>`;
        })}
      </div>
    </div>
  </div>`;
}

/* ============== VOTE UPDATE — rounds in rows, parties in columns ============== */
function AdminVoteUpdate({ user, constituencies, setConstituencies, candidates, setCandidates, segments=[], setSegments, setRawRoundRows, onPublish, onToast }) {
  const [consId, setConsId] = useState(constituencies[0]?.id || '');
  const cons = useMemo(() => constituencies.find(c => c.id === consId) || constituencies[0], [consId, constituencies]);
  const totalRounds = cons?.totalRounds || 15;
  const consCands = useMemo(() => candidates.filter(c => c.consId === consId), [candidates, consId]);
  const [candidateEditor, setCandidateEditor] = useState(null);
  const canManageVoteSetup = user?.role === 'super_admin';

  /* draft[roundKey][candidateId] = vote string; roundKey='postal' for postal */
  const [draft, setDraft] = useState({});

  /* Load saved data into draft whenever constituency changes */
  useEffect(() => {
    const d = {};
    const allRoundKeys = [...Array.from({length: MAX_ROUNDS}, (_,i) => String(i+1)), 'postal'];
    allRoundKeys.forEach(rk => {
      d[rk] = {};
      consCands.forEach(c => {
        if (rk === 'postal') {
          d[rk][c.id] = c.postalVotes ? String(c.postalVotes) : '';
        } else {
          const r = parseInt(rk, 10);
          d[rk][c.id] = (c.rounds && c.rounds[r]) ? String(c.rounds[r]) : '';
        }
      });
    });
    setDraft(d);
  }, [consId, consCands.length]);

  const setVal = (roundKey, cid, v) => {
    const cleaned = v.replace(/[^0-9]/g, '');
    setDraft(prev => ({ ...prev, [roundKey]: { ...(prev[roundKey]||{}), [cid]: cleaned } }));
  };

  const addCandidate = () => {
    if (!canManageVoteSetup) return;
    setCandidateEditor({ new:true, name:'', party:'OTH', consId, photoSeed:'c'+Date.now(), photoUrl:'', symbolUrl:'' });
  };
  const saveCandidate = (c) => {
    if (!c.name || !c.consId || !c.party) { onToast('Candidate name, constituency and party are required', 'err'); return; }
    const id = 'c_' + Date.now();
    const newCand = { id, name:c.name, name_ml:c.name, party:c.party, consId:c.consId, photoSeed:c.photoSeed||id, photoUrl:c.photoUrl||'', symbolUrl:c.symbolUrl||'', votes:0, postalVotes:0, rounds:{} };
    setCandidates(prev => [...prev, newCand]);
    supaUpsert('candidates', candidateToDb(newCand));
    setCandidateEditor(null);
    onToast('Candidate added');
  };
  const addOtherCount = async () => {
    if (!canManageVoteSetup) return;
    const id = `oth_${consId}`;
    if (candidates.some(c => c.id === id || (c.consId === consId && c.party === 'OTH' && /^other candidates$/i.test(c.name || c.name_ml || '')))) {
      onToast('Other Candidates count already exists for this constituency', 'err');
      return;
    }
    const newCand = { id, name:'Other Candidates', name_ml:'Other Candidates', party:'OTH', consId, photoSeed:id, photoUrl:'', symbolUrl:'', votes:0, postalVotes:0, rounds:{} };
    setCandidates(prev => [...prev, newCand]);
    setDraft(prev => {
      const next = { ...prev };
      [...Array.from({length: MAX_ROUNDS}, (_,i) => String(i+1)), 'postal'].forEach(rk => {
        next[rk] = { ...(next[rk] || {}), [id]: '' };
      });
      return next;
    });
    try {
      if (supa) {
        const r = await supa.from('candidates').upsert(candidateToDb(newCand), { onConflict:'id' });
        if (r.error) throw r.error;
      }
      onToast('Other Candidates count added');
    } catch(e) {
      console.warn('other count add failed', e);
      setCandidates(prev => prev.filter(x => x.id !== id));
      onToast(`Other count save failed: ${e.message || e}`, 'err');
    }
  };

  /* Compute cumulative after each row for a candidate */
  const cumulative = useMemo(() => {
    const cum = {};
    consCands.forEach(c => {
      cum[c.id] = {};
      let running = 0;
      for (let r = 1; r <= MAX_ROUNDS; r++) {
        running += parseInt(draft[String(r)]?.[c.id] || c.rounds?.[r] || 0, 10) || 0;
        cum[c.id][r] = running;
      }
      cum[c.id]['postal'] = running + (parseInt(draft['postal']?.[c.id] || c.postalVotes || 0, 10) || 0);
    });
    return cum;
  }, [draft, consCands]);

  const save = async (publish) => {
    const next = candidates.map(c => {
      if (c.consId !== consId) return c;
      const rounds = {};
      for (let r = 1; r <= MAX_ROUNDS; r++) {
        const v = draft[String(r)]?.[c.id];
        if (v !== undefined && v !== '') {
          const n = parseInt(v, 10) || 0;
          if (n > 0) rounds[r] = n;
        }
      }
      const postalVotes = parseInt(draft['postal']?.[c.id], 10) || 0;
      const total = Object.values(rounds).reduce((s,vv) => s + (parseInt(vv,10)||0), 0) + postalVotes;
      return { ...c, rounds, postalVotes, votes: total };
    });
    const updatedCons = constituencies.map(co => {
      if (co.id !== consId) return co;
      const consNext = next.filter(c => c.consId === consId);
      const maxR = Math.max(0, ...consNext.flatMap(c => Object.keys(c.rounds||{}).map(r => parseInt(r,10)).filter(n => n > 0)));
      return { ...co, completedRounds: maxR };
    });
    setCandidates(next);
    setConstituencies(updatedCons);

    const candidateRows = next.filter(c=>c.consId===consId).map(c => ({
      id: c.id, cons_id: c.consId, name_ml: c.name||c.name_ml, party: c.party,
      photo_url: c.photoUrl||'', symbol_url: c.symbolUrl||'', photo_seed: c.photoSeed||'',
      postal_votes: c.postalVotes||0
    }));
    const roundRows = [];
    next.filter(c=>c.consId===consId).forEach(c => {
      Object.entries(c.rounds||{}).forEach(([r,v]) => {
        if (v) roundRows.push({ candidate_id: c.id, cons_id: c.consId, round_number: parseInt(r,10), votes: v });
      });
      if (c.postalVotes) roundRows.push({ candidate_id: c.id, cons_id: c.consId, round_number: 0, votes: c.postalVotes });
    });

    try {
      if (supa && candidateRows.length) {
        const candidateSave = await supa.from('candidates').upsert(candidateRows, { onConflict: 'id' });
        if (candidateSave.error) throw candidateSave.error;
      }
      await supaSaveRoundVotes(consId, roundRows);
      await supaUpdateWhere('constituencies', {
        completed_rounds: updatedCons.find(c => c.id === consId)?.completedRounds || 0,
        total_rounds: updatedCons.find(c => c.id === consId)?.totalRounds || totalRounds
      }, { id: consId });
    } catch(e) {
      console.warn('vote save failed', e);
      onToast(`DB save failed: ${e.message || e}`, 'err');
      return;
    }

    if (publish) onPublish(`${cons?.name_ml || cons?.ml} � update`);
    onToast(publish ? 'Published and saved' : 'Saved');
  };

  const resetConstituency = async () => {
    if (!canManageVoteSetup) return;
    if (!confirm(`${cons?.name_ml || cons?.name_en || consId} - Reset all vote data to 0?`)) return;
    const next = candidates.map(c => c.consId !== consId ? c : { ...c, rounds:{}, postalVotes:0, votes:0 });
    const updatedCons = constituencies.map(co => co.id === consId ? { ...co, completedRounds:0 } : co);
    const updatedSegments = segments.map(s => s.id === consId ? { ...s, round:0, udf:0, ldf:0, nda:0, oth:0, udf_t:0, ldf_t:0, nda_t:0, oth_t:0, rounds:{} } : s);
    setCandidates(next);
    setConstituencies(updatedCons);
    setSegments && setSegments(updatedSegments);
    setRawRoundRows && setRawRoundRows(prev => (prev || []).filter(r => r.cons_id !== consId));
    setDraft({});

    try {
      if (supa) {
        let r = await supa.from('candidate_round_votes').delete().eq('cons_id', consId);
        if (r.error) throw r.error;
      }
      const resetRows = next.filter(c => c.consId === consId).map(c => ({
        id: c.id, cons_id: c.consId, name_ml: c.name||c.name_ml, party: c.party,
        photo_url: c.photoUrl||'', symbol_url: c.symbolUrl||'', photo_seed: c.photoSeed||'',
        postal_votes: 0
      }));
      if (supa && resetRows.length) {
        let r = await supa.from('candidates').upsert(resetRows, { onConflict:'id' });
        if (r.error) throw r.error;
        r = await supa.from('constituencies').update({ completed_rounds:0 }).eq('id', consId);
        if (r.error) throw r.error;
      }
      await supaUpdateWhere('lac_segments', { current_round:0, udf_current:0, ldf_current:0, nda_current:0, oth_current:0, udf_total:0, ldf_total:0, nda_total:0, oth_total:0, rounds_json:'{}' }, { id: consId });
      onToast('Vote count reset');
    } catch(e) {
      console.warn('resetConstituency failed', e);
      onToast(`Reset failed: ${e.message || e}`, 'err');
    }
  };

  const resetAll = async () => {
    if (!canManageVoteSetup) return;
    if (!confirm('Reset ALL constituencies vote data to 0?')) return;
    const next = candidates.map(c => ({ ...c, rounds:{}, postalVotes:0, votes:0 }));
    const updatedCons = constituencies.map(co => ({ ...co, completedRounds:0 }));
    const updatedSegments = segments.map(s => ({ ...s, round:0, udf:0, ldf:0, nda:0, oth:0, udf_t:0, ldf_t:0, nda_t:0, oth_t:0, rounds:{} }));
    setCandidates(next);
    setConstituencies(updatedCons);
    setSegments && setSegments(updatedSegments);
    setRawRoundRows && setRawRoundRows([]);
    setDraft({});

    try {
      if (supa) {
        let r = await supa.from('candidate_round_votes').delete().gte('round_number', 0);
        if (r.error) throw r.error;
        r = await supa.from('candidates').upsert(next.map(c => ({
          id: c.id, cons_id: c.consId, name_ml: c.name||c.name_ml, party: c.party,
          photo_url: c.photoUrl||'', symbol_url: c.symbolUrl||'', photo_seed: c.photoSeed||'',
          postal_votes: 0
        })), { onConflict:'id' });
        if (r.error) throw r.error;
        r = await supa.from('constituencies').upsert(updatedCons.map(co => ({
          id: co.id,
          name_ml: co.name_ml,
          name_en: co.name_en,
          completed_rounds: 0,
          total_rounds: co.totalRounds || co.total || 15,
          counting_status: co.countingStatus || 'live'
        })), { onConflict:'id' });
        if (r.error) throw r.error;
      }
      await supaUpsertBatch('lac_segments', updatedSegments.map(segmentToDb));
      onToast('All vote counts reset');
    } catch(e) {
      console.warn('resetAll failed', e);
      onToast(`Reset all failed: ${e.message || e}`, 'err');
    }
  };
  const updateStatus = async (newStatus) => {
    const updatedCons = constituencies.map(co => co.id === consId ? { ...co, countingStatus: newStatus } : co);
    setConstituencies(updatedCons);
    await supaUpdateWhere('constituencies', { counting_status: newStatus }, { id: consId });
    onToast('സ്റ്റാറ്റസ് അപ്ഡേറ്റ് ചെയ്തു');
  };

  const curStatus = COUNTING_STATUSES.find(s => s.val === (cons?.countingStatus||'live')) || COUNTING_STATUSES[1];

  /* Show rows up to totalRounds + postal */
  const displayRows = [...Array.from({length: totalRounds}, (_,i) => ({ key: String(i+1), label: `R${String(i+1).padStart(2,'0')}`, isPostal: false })),
    { key: 'postal', label: 'POSTAL', isPostal: true }];

  return html`<div>
    <!-- Top controls -->
    <div class="adm-bar" style="flex-wrap:wrap;gap:10px">
      <div class="adm-fld" style="min-width:200px">
        <label>Constituency / മണ്ഡലം</label>
        <select class="adm-inp" value=${consId} onChange=${e => setConsId(e.target.value)}>
          ${constituencies.map(c => html`<option key=${c.id} value=${c.id}>${c.name_en} · ${c.name_ml}</option>`)}
        </select>
      </div>
      ${canManageVoteSetup && html`<div class="adm-fld">
        <label>Total Rounds</label>
        <select class="adm-inp" style="width:90px" value=${totalRounds} onChange=${e => {
          const n = parseInt(e.target.value,10);
          setConstituencies(prev => prev.map(co => co.id===consId ? {...co, totalRounds:n} : co));
        }}>
          ${Array.from({length:30},(_,i)=>i+1).map(n => html`<option key=${n} value=${n}>${n}</option>`)}
        </select>
      </div>`}
      <div class="adm-fld" style="min-width:200px">
        <label>Counting Status / എണ്ണൽ നില</label>
        <select class="adm-inp" value=${cons?.countingStatus||'live'} onChange=${e => updateStatus(e.target.value)} style=${`color:${curStatus.color};font-weight:800`}>
          ${COUNTING_STATUSES.map(s => html`<option key=${s.val} value=${s.val} style="color:${s.color}">${s.en} · ${s.ml}</option>`)}
        </select>
      </div>
      ${canManageVoteSetup && html`<div style="display:flex;align-items:flex-end">
        <button class="adm-btn primary" onClick=${addCandidate}><${Icon} d=${I.plus} size=${13}/> Add Candidate</button>
      </div>`}
      ${canManageVoteSetup && html`<div style="display:flex;align-items:flex-end">
        <button class="adm-btn ghost" onClick=${addOtherCount}><${Icon} d=${I.plus} size=${13}/> Other Count</button>
      </div>`}
      <div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap">
        <button class="adm-btn ghost" onClick=${() => save(false)}><${Icon} d=${I.save} size=${13}/> Save Draft</button>
        <button class="adm-btn green" onClick=${() => save(true)}><${Icon} d=${I.share} size=${13}/> Save & Publish</button>
        ${canManageVoteSetup && html`<button class="adm-btn" style="background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);color:#fbbf24;padding:8px 14px;border-radius:7px" onClick=${resetConstituency}><${Icon} d=${I.x} size=${13}/> Reset This</button>`}
        ${canManageVoteSetup && html`<button class="adm-btn" style="background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#f87171;padding:8px 14px;border-radius:7px" onClick=${resetAll}><${Icon} d=${I.trsh} size=${13}/> Reset All</button>`}
      </div>
    </div>

    <!-- Round × Party table -->
    <div class="adm-card">
      <h3 class="adm-card-t">
        <span>${cons?.name_ml}</span>
        <span style="margin-left:8px;padding:2px 10px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:1.5px;background:${curStatus.color}22;color:${curStatus.color};border:1px solid ${curStatus.color}55">${curStatus.en}</span>
      </h3>
      <div style="overflow:auto;max-height:calc(100vh - 280px)">
      <table class="adm-tab" style="min-width:900px">
        <thead>
          <tr>
            <th style="width:56px;text-align:left">Round</th>
            ${consCands.map(c => html`<th key=${c.id} style="text-align:right;min-width:120px">
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
                <span class="pty-tag ${(c.party||'').toLowerCase()}" style="font-size:9px">${c.party}</span>
                <span style="font-size:11px;font-weight:700;color:#fff;max-width:180px;overflow:visible;text-overflow:clip;white-space:normal;line-height:1.2;overflow-wrap:anywhere">${c.name||c.name_ml}</span>
              </div>
            </th>`)}
            <th style="text-align:right;min-width:100px;color:#22c55e">Cumulative</th>
          </tr>
        </thead>
        <tbody>
          ${displayRows.map(({ key, label, isPostal }) => {
            const rn = isPostal ? null : parseInt(key, 10);
            const hasData = consCands.some(c => isPostal ? (c.postalVotes > 0) : (c.rounds?.[rn] > 0));
            const isCurrentRound = !isPostal && rn === (cons?.completedRounds || 0) + 1;
            const rowStyle = isPostal ? 'background:rgba(34,197,94,.04);border-top:2px solid rgba(34,197,94,.25)' :
              (isCurrentRound ? 'background:rgba(251,191,36,.06);border-top:1px solid rgba(251,191,36,.2);border-bottom:1px solid rgba(251,191,36,.2)' :
              (hasData ? '' : 'opacity:.35'));
            const roundTotal = consCands.reduce((s,c) => s + (parseInt(draft[key]?.[c.id] || (isPostal ? c.postalVotes : c.rounds?.[rn]) || 0, 10)), 0);
            return html`<tr key=${key} style=${rowStyle}>
              <td style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11px;color:${isPostal?'#22c55e':isCurrentRound?'#fbbf24':'rgba(255,255,255,.78)'}">
                ${label}${isCurrentRound ? html`<span style="font-size:8px;margin-left:4px;color:#fbbf24">▲</span>` : null}
              </td>
              ${consCands.map(c => html`<td key=${c.id} style="background:${isPostal?'rgba(34,197,94,.05)':isCurrentRound?'rgba(251,191,36,.05)':''}">
                <input class="adm-inp num" type="text" inputmode="numeric" placeholder="—"
                  value=${draft[key]?.[c.id] ?? ((isPostal ? c.postalVotes : c.rounds?.[rn]) ? String(isPostal ? c.postalVotes : c.rounds[rn]) : '')}
                  onInput=${e => setVal(key, c.id, e.target.value)}
                  style="width:100%;text-align:right;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:13px;color:${isPostal?'#22c55e':isCurrentRound?'#fbbf24':'#fff'};padding:5px 8px"/>
              </td>`)}
              <!-- Cumulative total for this row (sum of all parties at this round) -->
              <td class="num" style="color:#22c55e;font-family:'JetBrains Mono',monospace;font-weight:800">
                ${isPostal ?
                  fmtIN(consCands.reduce((s,c) => s + (cumulative[c.id]?.postal||0), 0)) :
                  fmtIN(consCands.reduce((s,c) => s + (cumulative[c.id]?.[rn]||0), 0))
                }
              </td>
            </tr>`;
          })}
        </tbody>
        <tfoot>
          <tr style="background:rgba(251,191,36,.08);border-top:2px solid rgba(251,191,36,.3)">
            <td style="font-family:'JetBrains Mono',monospace;font-weight:900;font-size:11px;color:#fbbf24">TOTAL</td>
            ${consCands.map(c => {
              const total = Object.values(c.rounds||{}).reduce((s,v)=>s+(parseInt(v,10)||0),0) + (c.postalVotes||0);
              const draftTotal = Array.from({length:totalRounds},(_,i)=>String(i+1)).reduce((s,rk) =>
                s + (parseInt(draft[rk]?.[c.id]||c.rounds?.[parseInt(rk,10)]||0,10)||0), 0) + (parseInt(draft['postal']?.[c.id]||c.postalVotes||0,10)||0);
              return html`<td key=${c.id} class="num" style="font-family:'JetBrains Mono',monospace;font-weight:900;font-size:14px;color:#22c55e">${fmtIN(draftTotal)}</td>`;
            })}
            <td class="num" style="font-family:'JetBrains Mono',monospace;font-weight:900;font-size:14px;color:#22c55e">
              ${fmtIN(consCands.reduce((s,c) => {
                const draftTotal = Array.from({length:totalRounds},(_,i)=>String(i+1)).reduce((ss,rk)=>ss+(parseInt(draft[rk]?.[c.id]||c.rounds?.[parseInt(rk,10)]||0,10)||0),0)+(parseInt(draft['postal']?.[c.id]||c.postalVotes||0,10)||0);
                return s + draftTotal;
              }, 0))}
            </td>
          </tr>
        </tfoot>
      </table>
      </div>
      <div class="adm-note">
        <${Icon} d=${I.zap} size=${13} stroke="#fbbf24"/>
        <span>Postal ballot entered in last row. Cumulative column shows running total across parties.</span>
      </div>
    </div>
    ${candidateEditor && html`<${CandidateModal} candidate=${candidateEditor} constituencies=${constituencies} onSave=${saveCandidate} onClose=${() => setCandidateEditor(null)}/>`}
  </div>`;
}



/* ============== LAC BREAKDOWN — round selector + edit (no separate postal; postal is round 0 in Vote Update) ============== */
function AdminLACBreakdown({ segments, setSegments, onToast }) {
  const totalRounds = 30;
  const nonPostal = segments.filter(s => !s.postal);

  const [segId, setSegId] = useState(nonPostal[0]?.id || '');
  const [round, setRound] = useState(1);
  const [draft, setDraft] = useState({ UDF:'', LDF:'', NDA:'', OTH:'' });

  const seg = segments.find(s => s.id === segId);

  /* Load draft when seg/round changes */
  useEffect(() => {
    if (!seg) return;
    const r = (seg.rounds && seg.rounds[round]) || { UDF:0, LDF:0, NDA:0, OTH:0 };
    setDraft({ UDF: r.UDF || '', LDF: r.LDF || '', NDA: r.NDA || '', OTH: r.OTH || '' });
  }, [segId, round]);

  const setVal = (party, val) => {
    const cleaned = val.replace(/[^0-9]/g, '');
    setDraft(d => ({ ...d, [party]: cleaned }));
  };

  /* Compute updated cumulative for the selected segment */
  const cumPreview = useMemo(() => {
    if (!seg) return null;
    const rounds = { ...(seg.rounds || {}) };
    rounds[round] = {
      UDF: parseInt(draft.UDF,10)||0, LDF: parseInt(draft.LDF,10)||0,
      NDA: parseInt(draft.NDA,10)||0, OTH: parseInt(draft.OTH,10)||0
    };
    const cum = { UDF:0, LDF:0, NDA:0, OTH:0 };
    Object.keys(rounds).forEach(r => {
      ['UDF','LDF','NDA','OTH'].forEach(p => { cum[p] += parseInt(rounds[r]?.[p],10) || 0; });
    });
    return cum;
  }, [seg, round, draft]);

  const save = () => {
    const next = segments.map(s => {
      if (s.id !== segId) return s;
      const rounds = { ...(s.rounds || {}) };
      rounds[round] = {
        UDF: parseInt(draft.UDF,10)||0, LDF: parseInt(draft.LDF,10)||0,
        NDA: parseInt(draft.NDA,10)||0, OTH: parseInt(draft.OTH,10)||0
      };
      const cum = { UDF:0, LDF:0, NDA:0, OTH:0 };
      Object.keys(rounds).forEach(r => {
        ['UDF','LDF','NDA','OTH'].forEach(p => { cum[p] += parseInt(rounds[r]?.[p],10) || 0; });
      });
      const maxRound = Math.max(...Object.keys(rounds).map(r=>parseInt(r,10)).filter(n=>!isNaN(n)), 0);
      return { ...s, rounds, round: maxRound, udf:rounds[maxRound]?.UDF||0, ldf:rounds[maxRound]?.LDF||0, nda:rounds[maxRound]?.NDA||0, oth:rounds[maxRound]?.OTH||0,
                       udf_t:cum.UDF, ldf_t:cum.LDF, nda_t:cum.NDA, oth_t:cum.OTH };
    });
    setSegments(next);
    // Sync to Supabase
    const updSeg = next.find(s => s.id === segId);
    if (updSeg) supaUpsert('lac_segments', segmentToDb(updSeg));
    onToast(`${updSeg?.name} · റൗണ്ട് ${pad2N(round)} സേവ് ചെയ്തു`);
  };

  return html`<div class="lac-bd">
    <div class="adm-grid-2">
      <!-- Selector & entry card -->
      <div class="adm-card adm-card-tight">
        <h3 class="adm-card-t"><${Icon} d=${I.lac} size=${15} stroke="#fbbf24"/> LAC Round-wise Vote Entry</h3>
        <div class="adm-form-grid">
          <div class="adm-fld">
            <label>LAC / Constituency</label>
            <select class="adm-inp" value=${segId} onChange=${e => setSegId(e.target.value)}>
              ${nonPostal.map(s => html`<option key=${s.id} value=${s.id}>${s.en} · ${s.name}</option>`)}
            </select>
          </div>
          <div class="adm-fld">
            <label>Round Number</label>
            <div style="display:flex;gap:5px;align-items:center">
              <button class="adm-btn ghost icon-only" onClick=${() => setRound(r=>Math.max(r-1,1))} title="Previous round"><${Icon} d=${I.chev_l} size=${13}/></button>
              <select class="adm-inp" value=${round} onChange=${e => setRound(parseInt(e.target.value,10))} style="flex:1;min-width:auto">
                ${Array.from({length:totalRounds}, (_,i) => html`<option key=${i+1} value=${i+1}>റൗണ്ട് ${pad2N(i+1)} / ${pad2N(totalRounds)}</option>`)}
              </select>
              <button class="adm-btn ghost icon-only" onClick=${() => setRound(r=>Math.min(r+1,totalRounds))} title="Next round"><${Icon} d=${I.chev_r} size=${13}/></button>
            </div>
          </div>
        </div>
        <div class="adm-vote-grid">
          ${['UDF','LDF','NDA','OTH'].map(p => html`<div key=${p} class="adm-vote-fld">
            <label class="adm-vote-l ${p.toLowerCase()}">
              <${PartySymbol} party=${p} size=${16}/>
              <span>${p}</span>
              <span style="font-size:10px;color:rgba(255,255,255,.45);font-weight:500;margin-left:4px">${PARTIES[p]?.sub||''}</span>
            </label>
            <input class="adm-inp num" type="text" inputmode="numeric" placeholder="0"
              value=${draft[p] || ''}
              onInput=${e => setVal(p, e.target.value)}/>
          </div>`)}
        </div>
        <div class="adm-cum-row">
          <div class="adm-cum-l">ഈ റൗണ്ടിൽ ചേർക്കുന്നത്</div>
          <div class="adm-cum-v" style="color:#22c55e">${fmtIN(['UDF','LDF','NDA','OTH'].reduce((s,p) => s + (parseInt(draft[p],10)||0), 0))}</div>
        </div>
        ${cumPreview && html`<div class="adm-cum-row gold">
          <div class="adm-cum-l">സേവ് ശേഷം ആകെ (cumulative)</div>
          <div class="adm-cum-v">${fmtIN(cumPreview.UDF + cumPreview.LDF + cumPreview.NDA + cumPreview.OTH)}</div>
        </div>`}
        <div class="adm-bar-r">
          <button class="adm-btn green" onClick=${save}><${Icon} d=${I.save} size=${13}/> Save & Publish</button>
        </div>
      </div>

      <!-- Cumulative overview for selected seg -->
      <div class="adm-card adm-card-tight">
        <h3 class="adm-card-t"><${Icon} d=${I.chart} size=${15} stroke="#fbbf24"/> Cumulative Preview</h3>
        ${cumPreview && html`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
          ${['UDF','LDF','NDA','OTH'].map(p => html`<div key=${p} style="padding:12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid ${PARTIES[p].color}44">
            <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:10px;color:${PARTIES[p].color};letter-spacing:1.5px;margin-bottom:4px">${p} · ${PARTIES[p].sub}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-weight:900;font-size:22px;color:#fff">${fmtIN(cumPreview[p])}</div>
          </div>`)}
        </div>`}
        <div class="adm-note">
          <${Icon} d=${I.zap} size=${13} stroke="#fbbf24"/>
          <span>Postal ballot is entered in the Vote Update tab (Postal round). LAC breakdown shows regular round votes only.</span>
        </div>
      </div>
    </div>

    <!-- All-LAC overview -->
    <div class="adm-card adm-card-tight" style="margin-top:14px">
      <h3 class="adm-card-t"><${Icon} d=${I.chart} size=${15} stroke="#fbbf24"/> All LAC Cumulative Status</h3>
      <table class="adm-tab compact">
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Segment</th>
            <th class="num">Round</th>
            <th class="num" style="color:#5b8def">UDF Cum</th>
            <th class="num" style="color:#f87171">LDF Cum</th>
            <th class="num" style="color:#fb923c">NDA Cum</th>
            <th class="num" style="color:#94a3b8">OTH Cum</th>
            <th class="num gold">Total</th>
          </tr>
        </thead>
        <tbody>
          ${segments.map((s, i) => html`<tr key=${s.id} class=${segId===s.id?'sel':''}>
            <td>${pad2N(i+1)}</td>
            <td><div style="font-weight:700;font-size:12px">${s.name}</div><div style="font-size:10px;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif">${s.en||''}${s.postal?' · POSTAL':''}</div></td>
            <td class="num">${pad2N(s.round||0)+'/15'}</td>
            <td class="num">${fmtIN((s.udf_t||0)+(s.postal?.UDF||0))}</td>
            <td class="num">${fmtIN((s.ldf_t||0)+(s.postal?.LDF||0))}</td>
            <td class="num">${fmtIN((s.nda_t||0)+(s.postal?.NDA||0))}</td>
            <td class="num">${fmtIN((s.oth_t||0)+(s.postal?.OTH||0))}</td>
            <td class="num gold">${fmtIN((s.udf_t||0)+(s.ldf_t||0)+(s.nda_t||0)+(s.oth_t||0)+(s.postal?.UDF||0)+(s.postal?.LDF||0)+(s.postal?.NDA||0)+(s.postal?.OTH||0))}</td>
          </tr>`)}
        </tbody>
      </table>
      <div class="adm-note">
        <${Icon} d=${I.zap} size=${13} stroke="#fbbf24"/>
        <span>Cumulative shows all rounds totalled including postal. Each round entry adds to the cumulative count automatically.</span>
      </div>
    </div>
  </div>`;
}

/* ============== CANDIDATES — CRUD with photo + symbol + name ============== */
function AdminCandidates({ candidates, setCandidates, constituencies, onToast }) {
  const [filter, setFilter] = useState('');
  const [editing, setEditing] = useState(null); // candidate object or {new:true}

  const filtered = candidates.filter(c => {
    if (!filter) return true;
    const f = filter.toLowerCase();
    return c.name.toLowerCase().includes(f) ||
           (constituencies.find(x => x.id === c.consId)?.en || '').toLowerCase().includes(f) ||
           c.party.toLowerCase().includes(f);
  });

  const startNew = () => setEditing({ new:true, name:'', party:'UDF', consId: constituencies[0]?.id || '', photoSeed:'c'+Date.now(), photoUrl:'', symbolUrl:'' });
  const saveCand = (c) => {
    if (!c.name || !c.consId || !c.party) { onToast('എല്ലാ നിർബന്ധിത വിവരങ്ങളും നൽകുക', 'err'); return; }
    if (c.new) {
      const id = 'c_' + Date.now();
      const newCand = { id, name:c.name, name_ml:c.name, party:c.party, consId:c.consId, photoSeed:c.photoSeed||id, photoUrl:c.photoUrl||'', symbolUrl:c.symbolUrl||'', votes:0, postalVotes:0, rounds:{} };
      setCandidates(prev => [...prev, newCand]);
      supaUpsert('candidates', candidateToDb(newCand));
      onToast('സ്ഥാനാർത്ഥി ചേർത്തു · Candidate added');
    } else {
      setCandidates(prev => prev.map(x => x.id === c.id ? { ...x, name:c.name, name_ml:c.name, party:c.party, consId:c.consId, photoSeed:c.photoSeed, photoUrl:c.photoUrl||'', symbolUrl:c.symbolUrl||'' } : x));
      supaUpsert('candidates', candidateToDb({...c, name_ml:c.name}));
      onToast('അപ്ഡേറ്റ് ചെയ്തു · Updated');
    }
    setEditing(null);
  };
  const delCand = (cid) => {
    if (!confirm('ഈ സ്ഥാനാർത്ഥിയെ നീക്കം ചെയ്യണോ?')) return;
    setCandidates(prev => prev.filter(x => x.id !== cid));
    supaDelete('candidates', cid);
    onToast('നീക്കം ചെയ്തു');
  };

  return html`<div>
    <div class="adm-bar">
      <div class="adm-fld" style="flex:1">
        <label>Search</label>
        <input class="adm-inp" placeholder="Name, party or constituency..." value=${filter} onInput=${e => setFilter(e.target.value)}/>
      </div>
      <button class="adm-btn primary" onClick=${startNew}><${Icon} d=${I.plus} size=${14}/> Add Candidate</button>
    </div>
    <div class="adm-card">
      <h3 class="adm-card-t">All Candidates · ${filtered.length} of ${candidates.length}</h3>
      <table class="adm-tab">
        <thead><tr><th style="width:40px">#</th><th>Candidate</th><th>Constituency</th><th>Party</th><th class="num">Total Votes (auto)</th><th style="width:120px">Actions</th></tr></thead>
        <tbody>
          ${filtered.map((c,i) => {
            const cons = constituencies.find(x => x.id === c.consId);
            return html`<tr key=${c.id}>
              <td>${pad2N(i+1)}</td>
              <td>
                <div style="display:flex;align-items:center;gap:10px">
                  <${Avatar} size=${36} party=${c.party} seed=${c.photoSeed||c.id} ring=${false} photoUrl=${c.photoUrl||''}/>
                  <div style="font-weight:700">${c.name}</div>
                </div>
              </td>
              <td>${cons?.name_ml || cons?.ml || '—'} <span style="opacity:.5;font-size:11px">${cons?.name_en || cons?.en || ''}</span></td>
              <td>
                <div style="display:flex;align-items:center;gap:6px">
                  <${PartySymbol} party=${c.party} size=${20} symbolUrl=${c.symbolUrl||''}/>
                  <span class="pty-tag ${c.party.toLowerCase()}">${c.party}</span>
                </div>
              </td>
              <td class="num">${fmtIN(c.votes||0)}</td>
              <td>
                <div style="display:flex;gap:6px">
                  <button class="adm-btn ghost" style="padding:5px 9px" onClick=${() => setEditing({...c})}><${Icon} d=${I.edit} size=${12}/></button>
                  <button class="adm-btn red" style="padding:5px 9px" onClick=${() => delCand(c.id)}><${Icon} d=${I.trsh} size=${12}/></button>
                </div>
              </td>
            </tr>`;
          })}
        </tbody>
      </table>
      <div class="adm-note">
        <${Icon} d=${I.zap} size=${13} stroke="#fbbf24"/>

    </div>
    ${editing && html`<${CandidateModal} candidate=${editing} constituencies=${constituencies} onSave=${saveCand} onClose=${() => setEditing(null)}/>`}

}

/* ============== WHATSAPP UPDATE ============== */
function AdminWhatsAppUpdate({ constituencies, candidates, onToast }) {
  const [consId, setConsId] = useState(constituencies[0]?.id || '');
  const [roundFrom, setRoundFrom] = useState('all');
  const [roundTo, setRoundTo] = useState('all');
  const textRef = useRef(null);
  const cons = useMemo(() => {
    if (consId === 'all') {
      return {
        id:'all',
        name_ml:'All constituencies',
        name_en:'All constituencies',
        completedRounds: constituencies.reduce((s,c) => s + (c.completedRounds || c.round || 0), 0),
        totalRounds: constituencies.reduce((s,c) => s + (c.totalRounds || c.total || 15), 0)
      };
    }
    return constituencies.find(c => c.id === consId) || constituencies[0];
  }, [constituencies, consId]);

  useEffect(() => {
    if (consId !== 'all' && !constituencies.some(c => c.id === consId)) setConsId(constituencies[0]?.id || '');
  }, [constituencies.length]);

  const maxWhatsRound = Math.max(1, ...((constituencies || []).map(c => parseInt(c.totalRounds || c.total || 15, 10) || 15)));
  const selectedVoteTotal = (candidate) => {
    if (roundFrom === 'all' && roundTo === 'all') return parseInt(candidate.votes, 10) || 0;
    const from = roundFrom === 'all' ? 1 : (parseInt(roundFrom, 10) || 1);
    const to = roundTo === 'all' ? maxWhatsRound : (parseInt(roundTo, 10) || maxWhatsRound);
    const lo = Math.min(from, to);
    const hi = Math.max(from, to);
    return Object.entries(candidate.rounds || {}).reduce((sum, [r, v]) => {
      const rn = parseInt(r, 10);
      if (Number.isNaN(rn) || rn < lo || rn > hi) return sum;
      return sum + (parseInt(v, 10) || 0);
    }, 0);
  };

  const generated = useMemo(() => {
    if (!cons) return '';
    const rows = candidates
      .filter(c => consId === 'all' || c.consId === cons.id)
      .map(c => ({ ...c, totalVotes: selectedVoteTotal(c) }))
      .sort((a,b) => b.totalVotes - a.totalVotes);
    const top = rows[0];
    const second = rows[1];
    const lead = top ? Math.max(0, (top.totalVotes || 0) - (second?.totalVotes || 0)) : 0;
    const updated = new Date().toLocaleString('en-IN', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit', hour12:true
    });
    if (consId === 'all') {
      const lines = [
        'കേരള നിയമസഭ തിരഞ്ഞെടുപ്പ് ഫലം 2026',
        '',
        `Updated: ${updated}`,
        ''
      ];
      constituencies.forEach((cns, blockIndex) => {
        const rows = candidates
          .filter(c => c.consId === cns.id)
          .map(c => ({ ...c, totalVotes: selectedVoteTotal(c) }))
          .sort((a,b) => b.totalVotes - a.totalVotes);
        const top = rows[0];
        const second = rows[1];
        const lead = top ? Math.max(0, (top.totalVotes || 0) - (second?.totalVotes || 0)) : 0;
        if (blockIndex > 0) lines.push('');
        lines.push(
          `മണ്ഡലം: ${cns.name_ml || cns.name || cns.name_en || ''}`,
          `റൗണ്ട് ${pad2N(cns.completedRounds || cns.round || 0)} / ${pad2N(cns.totalRounds || cns.total || 15)}`,
          ''
        );
        rows.forEach((c, i) => {
          const candidateName = c.name_ml || c.name || '';
          const party = c.party || '';
          const suffix = i === 0 ? `, ഭൂരിപക്ഷം ${fmtIN(lead)}` : '';
          lines.push(`${i + 1}. ${party} - ${candidateName} - ${fmtIN(c.totalVotes)}${suffix}`);
        });
        if (!rows.length) lines.push('സ്ഥാനാർത്ഥി വിവരങ്ങൾ ലഭ്യമല്ല');
      });
      lines.push('', 'ജില്ലാ ഇൻഫർമേഷൻ ഓഫീസ്, കോഴിക്കോട്');
      return lines.join('\n');
    }
    const lines = [
      'കേരള നിയമസഭ തിരഞ്ഞെടുപ്പ് ഫലം 2026',
      '',
      `Updated: ${updated}`,
      '',
      `മണ്ഡലം: ${cons.name_ml || cons.name || cons.name_en || ''}`,
      `റൗണ്ട് ${pad2N(cons.completedRounds || cons.round || 0)} / ${pad2N(cons.totalRounds || cons.total || 15)}`,
      ''
    ];
    rows.forEach((c, i) => {
      const candidateName = c.name_ml || c.name || '';
      const party = c.party || '';
      const suffix = i === 0 ? `, ഭൂരിപക്ഷം ${fmtIN(lead)}` : '';
      lines.push(`${i + 1}. ${party} - ${candidateName} - ${fmtIN(c.totalVotes)}${suffix}`);
    });
    if (!rows.length) lines.push('സ്ഥാനാർഥി വിവരങ്ങൾ ലഭ്യമല്ല');
    lines.push('', 'ജില്ലാ ഇൻഫർമേഷൻ ഓഫീസ്, കോഴിക്കോട്');
    return lines.join('\n');
  }, [cons, consId, constituencies, candidates, roundFrom, roundTo, maxWhatsRound]);

  const copyText = async () => {
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(generated);
      else {
        textRef.current?.select();
        document.execCommand('copy');
      }
      onToast('WhatsApp update copied');
    } catch(e) {
      console.warn('copy failed', e);
      textRef.current?.select();
      onToast('Copy failed. Text selected manually.', 'err');
    }
  };

  const sortedPreview = cons ? candidates
    .filter(c => consId === 'all' || c.consId === cons.id)
    .map(c => ({ ...c, totalVotes: selectedVoteTotal(c) }))
    .sort((a,b) => b.totalVotes - a.totalVotes) : [];

  return html`<div>
    <div class="adm-card">

/* ============== TICKER ============== */
function AdminTicker({ ticker, setTicker, onToast }) {
  const [draft, setDraft] = useState('');

  const syncTicker = async (items) => {
    if (!supa) throw new Error('Supabase is not initialized');
    const del = await supa.from('ticker_messages').delete().neq('id', 0);
    if (del.error) throw del.error;
    const rows = items.map((message, i) => ({ message, sort_order: i }));
    if (rows.length) {
      const ins = await supa.from('ticker_messages').insert(rows);
      if (ins.error) throw ins.error;
    }
  };
  const saveTicker = async (next, previous=ticker) => {
    setTicker(next);
    try {
      await syncTicker(next);
      return true;
    } catch(e) {
      console.warn('syncTicker', e);
      setTicker(previous);
      onToast('Ticker save failed. Check Supabase RLS/policies.');
      return false;
    }
  };
  const add = async () => {
    if (!draft.trim()) return;
    const next = [...ticker, draft.trim()];
    const ok = await saveTicker(next);
    if (!ok) return;
    setDraft('');
    onToast('ടിക്കർ ചേർത്തു');
  };
  const remove = async (idx) => {
    const next = ticker.filter((_,i) => i !== idx);
    const ok = await saveTicker(next);
    if (!ok) return;
    onToast('നീക്കം ചെയ്തു');
  };
  const move = async (idx, dir) => {
    const next = [...ticker];
    const ni = idx + dir;
    if (ni < 0 || ni >= next.length) return;
    [next[idx], next[ni]] = [next[ni], next[idx]];
    await saveTicker(next);
  };

  return html`<div>
    <div class="adm-card">
      <h3 class="adm-card-t">പുതിയ ടിക്കർ സന്ദേശം ചേർക്കുക</h3>
      <div style="display:flex;gap:10px;align-items:flex-end">
        <div class="adm-fld" style="flex:1">
          <label>Message</label>
          <input class="adm-inp" placeholder="ഉദാ: റൗണ്ട് 07 പൂർത്തിയായി" value=${draft} onInput=${e => setDraft(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter') add(); }}/>
        </div>
        <button class="adm-btn primary" onClick=${add}><${Icon} d=${I.plus} size=${13}/> Add</button>
      </div>
    </div>
    <div class="adm-card">
      <h3 class="adm-card-t">Active Ticker Items · ${ticker.length}</h3>
      <table class="adm-tab">
        <thead><tr><th style="width:50px">#</th><th>Message</th><th style="width:160px">Actions</th></tr></thead>
        <tbody>
          ${ticker.map((m, i) => html`<tr key=${i}>
            <td>${pad2N(i+1)}</td>
            <td>${m}</td>
            <td>
              <div style="display:flex;gap:5px">
                <button class="adm-btn ghost" style="padding:5px 8px" onClick=${() => move(i,-1)} disabled=${i===0}><${Icon} d=${I.chev_l} size=${12}/></button>
                <button class="adm-btn ghost" style="padding:5px 8px" onClick=${() => move(i,1)} disabled=${i===ticker.length-1}><${Icon} d=${I.chev_r} size=${12}/></button>
                <button class="adm-btn red" style="padding:5px 8px" onClick=${() => remove(i)}><${Icon} d=${I.trsh} size=${12}/></button>
              </div>
            </td>
          </tr>`)}
        </tbody>
      </table>
    </div>
  </div>`;
}

function AdminSettings({ settings, setSettings, constituencies, setConstituencies, candidates=[], onToast }) {
  const [s, setS] = useState({ ...settings });
  const [saving, setSaving] = useState(false);
  const [roundDraft, setRoundDraft] = useState(() => Object.fromEntries((constituencies || []).map(c => [c.id, c.totalRounds || c.total || 15])));
  const [exportFilter, setExportFilter] = useState({ consId:'all', party:'all', minRound:'', maxRound:'', includePostal:true });

  useEffect(() => {
    setRoundDraft(Object.fromEntries((constituencies || []).map(c => [c.id, c.totalRounds || c.total || 15])));
  }, [constituencies.length]);

  const flip = (k) => setS(p => ({...p, [k]: !p[k]}));
  const setVal = (k, v) => setS(p => ({...p, [k]: v}));
  const setRoundVal = (id, value) => {
    const n = Math.max(1, Math.min(99, parseInt(String(value).replace(/[^0-9]/g,''), 10) || 1));
    setRoundDraft(p => ({ ...p, [id]: n }));
  };
  const setExportVal = (k, v) => setExportFilter(p => ({ ...p, [k]: v }));
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const maxExportRound = Math.max(1, ...((constituencies || []).map(c => parseInt(c.totalRounds || c.total || 15, 10) || 15)));
  const exportRows = () => {
    const minR = exportFilter.minRound === 'all' ? 1 : (parseInt(exportFilter.minRound, 10) || 1);
    const maxR = exportFilter.maxRound === 'all' ? 99 : (parseInt(exportFilter.maxRound, 10) || 99);
    const consList = (constituencies || []).filter(c => exportFilter.consId === 'all' || c.id === exportFilter.consId);
    const summary = [];
    const rounds = [];
    consList.forEach(cons => {
      (candidates || [])
        .filter(c => c.consId === cons.id)
        .filter(c => exportFilter.party === 'all' || c.party === exportFilter.party)
        .sort((a,b) => String(a.party || '').localeCompare(String(b.party || '')) || String(a.name_ml || a.name || '').localeCompare(String(b.name_ml || b.name || '')))
        .forEach(c => {
          const roundVotes = Object.entries(c.rounds || {})
            .map(([r,v]) => ({ round:parseInt(r,10), votes:parseInt(v,10)||0 }))
            .filter(x => !Number.isNaN(x.round) && x.round >= minR && x.round <= maxR)
            .sort((a,b) => a.round - b.round);
          const roundTotal = roundVotes.reduce((sum,x) => sum + x.votes, 0);
          const postal = exportFilter.includePostal ? (parseInt(c.postalVotes,10)||0) : 0;
          summary.push({
            cons: cons.name_ml || cons.name_en || cons.id,
            consEn: cons.name_en || '',
            candidate: c.name_ml || c.name || '',
            party: c.party || '',
            roundVotes: roundTotal,
            postalVotes: postal,
            totalVotes: roundTotal + postal,
            completedRounds: cons.completedRounds || cons.round || 0,
            totalRounds: cons.totalRounds || cons.total || 15,
            status: cons.countingStatus || cons.status || 'live'
          });
          roundVotes.forEach(x => rounds.push({ cons:cons.name_ml || cons.name_en || cons.id, candidate:c.name_ml || c.name || '', party:c.party || '', round:x.round, votes:x.votes }));
          if (exportFilter.includePostal && postal) rounds.push({ cons:cons.name_ml || cons.name_en || cons.id, candidate:c.name_ml || c.name || '', party:c.party || '', round:'Postal', votes:postal });
        });
    });
    return { summary, rounds };
  };
  const reportHtml = () => {
    const { summary, rounds } = exportRows();
    const filterText = [
      `Constituency: ${exportFilter.consId === 'all' ? 'All' : (constituencies.find(c => c.id === exportFilter.consId)?.name_en || exportFilter.consId)}`,
      `Party: ${exportFilter.party === 'all' ? 'All' : exportFilter.party}`,
      `Rounds: ${!exportFilter.minRound || exportFilter.minRound === 'all' ? 'All' : exportFilter.minRound} to ${!exportFilter.maxRound || exportFilter.maxRound === 'all' ? 'All' : exportFilter.maxRound}`,
      `Postal votes: ${exportFilter.includePostal ? 'Included' : 'Excluded'}`
    ].join(' | ');
    const summaryRows = summary.map(r => `<tr><td>${esc(r.cons)}</td><td>${esc(r.consEn)}</td><td>${esc(r.candidate)}</td><td>${esc(r.party)}</td><td>${r.roundVotes}</td><td>${r.postalVotes}</td><td>${r.totalVotes}</td><td>${r.completedRounds}/${r.totalRounds}</td><td>${esc(r.status)}</td></tr>`).join('');
    const roundRows = rounds.map(r => `<tr><td>${esc(r.cons)}</td><td>${esc(r.candidate)}</td><td>${esc(r.party)}</td><td>${esc(r.round)}</td><td>${r.votes}</td></tr>`).join('');
    return `<!doctype html><html><head><meta charset="utf-8"><title>Election Data Export</title><style>body{font-family:'Anek Malayalam',Arial,sans-serif;color:#111}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:22px 0 8px}.meta{font-size:12px;color:#555;margin-bottom:14px}table{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:18px}th,td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eceff5;font-weight:800}td:nth-child(5),td:nth-child(6),td:nth-child(7),td:nth-child(8),td:nth-child(9){text-align:right}@media print{button{display:none}body{margin:14mm}}</style></head><body><h1>DIO Kozhikode Election Data Export</h1><div class="meta">Generated: ${esc(new Date().toLocaleString())}<br>${esc(filterText)}</div><h2>Candidate Summary</h2><table><thead><tr><th>Constituency</th><th>English Name</th><th>Candidate</th><th>Party</th><th>Round Votes</th><th>Postal Votes</th><th>Total Votes</th><th>Rounds</th><th>Status</th></tr></thead><tbody>${summaryRows || '<tr><td colspan="9">No data for selected filters</td></tr>'}</tbody></table><h2>Round Wise Votes</h2><table><thead><tr><th>Constituency</th><th>Candidate</th><th>Party</th><th>Round</th><th>Votes</th></tr></thead><tbody>${roundRows || '<tr><td colspan="5">No round data for selected filters</td></tr>'}</tbody></table></body></html>`;
  };
  const downloadFile = (filename, mime, content) => {
    const blob = new Blob([content], { type:mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);

  const exportExcel = () => {

  const saveAll = async () => {

    const updatedCons = constituencies.map(c => ({ ...c, totalRounds: roundDraft[c.id] || c.totalRounds || c.total || 15 }));
    setSaving(true);
    try {

/* ============== USERS ============== */
function AdminUsers({ users, setUsers, curUser, onToast }) {
  const [editing, setEditing] = useState(null);
  const [revealedIds, setRevealedIds] = useState(new Set());
  const isSuper = curUser.role === 'super_admin';

  const toggleReveal = (uid) => {
    setRevealedIds(prev => {
      const next = new Set(prev);
      if (next.has(uid)) next.delete(uid); else next.add(uid);
      return next;
    });
  };

  const startNew = () => {
    if (!isSuper) { onToast('സൂപ്പർ അഡ്മിന് മാത്രമേ ഉപയോക്താക്കളെ ചേർക്കാൻ കഴിയൂ', 'err'); return; }
    setEditing({ new:true, id:'', name:'', email:'', password:'', role:'editor' });
  };
  const save = () => {
    if (!editing.name || !editing.email) { onToast('പേരും ഇമെയിലും നൽകുക', 'err'); return; }
    if (editing.new && !editing.password) { onToast('പാസ്‌വേഡ് നൽകുക', 'err'); return; }
    if (editing.new) {
      const id = 'u_' + Date.now();
      const newUser = { ...editing, id };
      setUsers(prev => [...prev, newUser]);
      supaUpsert('app_users', userToDb(newUser));
      onToast('ഉപയോക്താവ് ചേർത്തു');
    } else {
      setUsers(prev => prev.map(u => u.id === editing.id ? { ...editing } : u));
      supaUpsert('app_users', userToDb(editing));
      onToast('അപ്ഡേറ്റ് ചെയ്തു');
    }
    setEditing(null);
  };
  const del = (uid) => {
    if (uid === curUser.id) { onToast('നിങ്ങളെത്തന്നെ നീക്കം ചെയ്യാൻ കഴിയില്ല', 'err'); return; }
    if (!isSuper) { onToast('സൂപ്പർ അഡ്മിന് മാത്രമേ കഴിയൂ', 'err'); return; }
    if (!confirm('നീക്കം ചെയ്യണോ?')) return;
    setUsers(prev => prev.filter(u => u.id !== uid));
    supaDelete('app_users', uid);
    onToast('നീക്കം ചെയ്തു');
  };

  return html`<div>
    <div class="adm-card" style="background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.2);margin-bottom:14px">
      <h3 class="adm-card-t" style="color:#fbbf24">
        <${Icon} d=${I.user} size=${14} stroke="#fbbf24"/>
        ഉപയോക്തൃ പങ്കിന്റെ അനുമതികൾ · Role-Based Access
      </h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-family:'Anek Malayalam',sans-serif;font-size:12px;color:rgba(255,255,255,.78)">
        <div><b style="color:#fbbf24;font-family:'Inter',sans-serif;letter-spacing:1px">SUPER ADMIN</b> — എല്ലാ പേജുകളിലേക്കും പ്രവേശനം. വോട്ട് അപ്ഡേറ്റ്, LAC, സ്ഥാനാർത്ഥികൾ, ഉപയോക്താക്കൾ, സജ്ജീകരണങ്ങൾ.</div>
        <div><b style="color:#22c55e;font-family:'Inter',sans-serif;letter-spacing:1px">EDITOR</b> — വോട്ട് അപ്ഡേറ്റ്, LAC, അറിയിപ്പുകൾ, ടിക്കർ, സോഷ്യൽ കാർഡുകൾ. ഉപയോക്താക്കൾ ഇല്ല.</div>
        <div><b style="color:#94a3b8;font-family:'Inter',sans-serif;letter-spacing:1px">VIEWER</b> — ഡാഷ്ബോർഡ് ഡാറ്റ കാണാൻ മാത്രം. എഡിറ്റ് ചെയ്യാനാകില്ല.</div>
      </div>
    </div>

    <div class="adm-bar">
      <div style="flex:1;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:#fff">All Users · ${users.length} ${isSuper?html`<span style="color:rgba(255,255,255,.5);font-weight:500;font-size:11px;margin-left:8px">Click 🔓 to reveal credentials</span>`:null}</div>
      ${isSuper && html`<button class="adm-btn primary" onClick=${startNew}><${Icon} d=${I.plus} size=${13}/> Add User</button>`}
    </div>

    <div class="adm-card">
      <table class="adm-tab">
        <thead><tr><th style="width:40px">#</th><th>Name</th><th>Email</th><th>Password</th><th style="width:120px">Role</th><th style="width:120px">Actions</th></tr></thead>
        <tbody>
          ${users.map((u,i) => {
            const pages = ROLE_PAGES[u.role] || [];
            const revealed = revealedIds.has(u.id);
            return html`<tr key=${u.id}>
              <td>${pad2N(i+1)}</td>
              <td>
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:13px;color:#1a1a1a">${(u.name||'U').slice(0,1).toUpperCase()}</div>
                  <div style="font-weight:700">${u.name}${u.id===curUser.id?' (You)':''}</div>
                </div>
              </td>
              <td><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.78)">${u.email}</span></td>
              <td>
                ${isSuper ? html`<div style="display:flex;align-items:center;gap:6px">
                  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${revealed?'#fbbf24':'rgba(255,255,255,.45)'}">${revealed?u.password:'••••••••'}</span>
                  <button class="adm-btn ghost" style="padding:3px 7px;font-size:11px" onClick=${() => toggleReveal(u.id)} title=${revealed?'Hide':'Show'}>${revealed?'🙈':'🔓'}</button>
                </div>` : html`<span style="color:rgba(255,255,255,.3);font-size:11px">— restricted —</span>`}
              </td>
              <td>
                <span style=${`display:inline-block;padding:3px 8px;border-radius:4px;background:${u.role==='super_admin'?'rgba(251,191,36,.2)':u.role==='editor'?'rgba(34,197,94,.2)':'rgba(148,163,184,.2)'};color:${u.role==='super_admin'?'#fbbf24':u.role==='editor'?'#22c55e':'#94a3b8'};font-family:'Inter',sans-serif;font-weight:800;font-size:10px;letter-spacing:1px`}>${ROLE_LABEL[u.role]}</span>
              </td>
              <td>
                <div style="display:flex;gap:6px">
                  <button class="adm-btn ghost" style="padding:5px 9px" onClick=${() => setEditing({...u, password:''})} disabled=${!isSuper && u.id !== curUser.id}><${Icon} d=${I.edit} size=${12}/></button>
                  <button class="adm-btn red" style="padding:5px 9px" onClick=${() => del(u.id)} disabled=${!isSuper || u.id===curUser.id}><${Icon} d=${I.trsh} size=${12}/></button>
                </div>
              </td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>

    ${editing && html`<div class="modal-bg" onClick=${() => setEditing(null)}>
      <div class="modal" onClick=${e => e.stopPropagation()}>
        <div class="modal-h"><div class="modal-t">${editing.new ? 'Add User' : 'Edit User'}</div><button class="modal-x" onClick=${() => setEditing(null)}><${Icon} d=${I.x} size=${14}/></button></div>
        <div class="modal-b">
          <div class="adm-fld" style="margin-bottom:12px">
            <label>Full Name</label>
            <input class="adm-inp" placeholder="Full name" value=${editing.name} onInput=${e => setEditing(p => ({...p, name:e.target.value}))}/>
          </div>
          <div class="adm-fld" style="margin-bottom:12px">
            <label>Email</label>
            <input class="adm-inp" type="email" placeholder="user@dio.kerala.gov.in" value=${editing.email} onInput=${e => setEditing(p => ({...p, email:e.target.value}))}/>
          </div>
          <div class="adm-fld" style="margin-bottom:12px">
            <label>Password ${!editing.new ? '(leave blank to keep)' : ''}</label>
            <input class="adm-inp" type="password" placeholder="••••••••" value=${editing.password} onInput=${e => setEditing(p => ({...p, password:e.target.value}))}/>
          </div>
          <div class="adm-fld">
            <label>Role</label>
            <select class="adm-inp" value=${editing.role} onChange=${e => setEditing(p => ({...p, role:e.target.value}))} disabled=${!isSuper}>
              <option value="super_admin">Super Admin</option>
              <option value="editor">Editor</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>
        </div>
        <div class="modal-f">
          <button class="adm-btn ghost" onClick=${() => setEditing(null)}>Cancel</button>
          <button class="adm-btn green" onClick=${save}><${Icon} d=${I.save} size=${13}/> Save User</button>
        </div>
      </div>
    </div>`}
  </div>`;
}

/* Inline DIO emblem path drawer for SVG cards (smaller, static) */

/* Embedded portrait used inside social cards (larger, more detailed than Avatar) */
function CardAvatar({ x=0, y=0, size=200, party='UDF', seed='x', ringColor }) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
  h = Math.abs(h);
  const skin = ['#d4a373','#c08763','#a06840','#b88862','#9c6b3f','#d6b08a'][h%6];
  const hair = ['#1a1a1a','#2c1810','#3d2817','#1f1611','#241710'][h%5];
  const facial = h % 3 === 0;
  const cheeks = h % 4 === 1;
  const ring = ringColor || PARTIES[party]?.color || '#fbbf24';
  const r = size/2;
  return html`<g transform=${`translate(${x},${y})`}>
    <defs>
      <clipPath id=${`cca-clip-${seed}`}><circle cx=${r} cy=${r} r=${r-3}/></clipPath>
    </defs>
    <circle cx=${r} cy=${r} r=${r} fill=${ring} opacity="0.18"/>
    <circle cx=${r} cy=${r} r=${r-3} fill="#f5f5f5" stroke=${ring} stroke-width="3"/>
    <g clip-path=${`url(#cca-clip-${seed})`}>
      <rect x="0" y="0" width=${size} height=${size} fill="#e8edf5"/>
      <!-- shoulders/shirt -->
      <ellipse cx=${r} cy=${size*1.08} rx=${size*0.55} ry=${size*0.4} fill="#fff"/>
      <path d=${`M${r-size*0.18} ${size*0.78} L${r-size*0.05} ${size*0.78} L${r} ${size*0.92} L${r+size*0.05} ${size*0.78} L${r+size*0.18} ${size*0.78} Z`} fill="#1f2937"/>
      <!-- neck -->
      <rect x=${r-size*0.09} y=${size*0.62} width=${size*0.18} height=${size*0.14} fill=${skin}/>
      <!-- head -->
      <ellipse cx=${r} cy=${size*0.42} rx=${size*0.22} ry=${size*0.26} fill=${skin}/>
      <!-- hair -->
      <path d=${`M${r-size*0.22} ${size*0.32} Q${r} ${size*0.16} ${r+size*0.22} ${size*0.32} Q${r+size*0.18} ${size*0.26} ${r} ${size*0.22} Q${r-size*0.18} ${size*0.26} ${r-size*0.22} ${size*0.32} Z`} fill=${hair}/>
      <!-- eyes -->
      <ellipse cx=${r-size*0.07} cy=${size*0.42} rx=${size*0.018} ry=${size*0.012} fill="#1a1a1a"/>
      <ellipse cx=${r+size*0.07} cy=${size*0.42} rx=${size*0.018} ry=${size*0.012} fill="#1a1a1a"/>
      <!-- nose -->
      <path d=${`M${r} ${size*0.45} Q${r-size*0.012} ${size*0.5} ${r} ${size*0.51} Q${r+size*0.012} ${size*0.5} ${r} ${size*0.45}`} fill="none" stroke="#a06840" stroke-width="0.8"/>
      <!-- mouth -->
      <path d=${`M${r-size*0.04} ${size*0.55} Q${r} ${size*0.575} ${r+size*0.04} ${size*0.55}`} fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/>
      ${cheeks ? html`<circle cx=${r-size*0.13} cy=${size*0.5} r=${size*0.018} fill="#dc2626" opacity="0.18"/><circle cx=${r+size*0.13} cy=${size*0.5} r=${size*0.018} fill="#dc2626" opacity="0.18"/>` : null}
      ${facial ? html`<path d=${`M${r-size*0.05} ${size*0.58} Q${r} ${size*0.62} ${r+size*0.05} ${size*0.58}`} fill="none" stroke=${hair} stroke-width="1.5" opacity="0.6"/>` : null}
    </g>
  </g>`;
}

/* Card-side party symbol (more detailed, for poster usage) */
function CardPartySymbol({ x=0, y=0, size=64, party='UDF' }) {
  const r = size/2;
  if (party === 'UDF') {
    return html`<g transform=${`translate(${x},${y})`}>
      <circle cx=${r} cy=${r} r=${r} fill="#fff" stroke="#1e5dff" stroke-width="2"/>
      <path d=${`M${r-size*0.27} ${r+size*0.02} Q${r-size*0.15} ${r-size*0.18} ${r-size*0.05} ${r-size*0.07} L${r+size*0.04} ${r-size*0.06} Q${r+size*0.18} ${r-size*0.06} ${r+size*0.22} ${r+size*0.06} L${r+size*0.18} ${r+size*0.21} Q${r+size*0.04} ${r+size*0.27} ${r-size*0.13} ${r+size*0.24} Q${r-size*0.27} ${r+size*0.18} ${r-size*0.27} ${r+size*0.02} Z`} fill="none" stroke="#0a1340" stroke-width="1.5"/>
      <path d=${`M${r-size*0.05} ${r-size*0.07} L${r-size*0.04} ${r-size*0.22}`} stroke="#0a1340" stroke-width="1.6" stroke-linecap="round"/>
      <path d=${`M${r+size*0.04} ${r-size*0.06} L${r+size*0.05} ${r-size*0.22}`} stroke="#0a1340" stroke-width="1.6" stroke-linecap="round"/>
      <path d=${`M${r+size*0.13} ${r-size*0.05} L${r+size*0.16} ${r-size*0.2}`} stroke="#0a1340" stroke-width="1.6" stroke-linecap="round"/>
      <path d=${`M${r-size*0.13} ${r-size*0.05} L${r-size*0.13} ${r-size*0.16}`} stroke="#0a1340" stroke-width="1.6" stroke-linecap="round"/>
    </g>`;
  }
  if (party === 'LDF') {
    return html`<g transform=${`translate(${x},${y})`}>
      <circle cx=${r} cy=${r} r=${r} fill="#fff" stroke="#dc1f2e" stroke-width="2"/>
      <path d=${`M${r-size*0.18} ${r+size*0.18} L${r+size*0.18} ${r-size*0.18}`} stroke="#dc1f2e" stroke-width="3" stroke-linecap="round"/>
      <circle cx=${r-size*0.18} cy=${r+size*0.18} r=${size*0.11} fill="none" stroke="#dc1f2e" stroke-width="2.5"/>
      <path d=${`M${r-size*0.04} ${r-size*0.28} L${r+size*0.28} ${r-size*0.04} L${r+size*0.18} ${r-size*0.18} Z`} fill="#dc1f2e"/>
    </g>`;
  }
  if (party === 'NDA') {
    return html`<g transform=${`translate(${x},${y})`}>
      <circle cx=${r} cy=${r} r=${r} fill="#fff" stroke="#ff7a1f" stroke-width="2"/>
      ${[0,72,144,216,288].map(deg => {
        const rad = deg*Math.PI/180;
        return html`<ellipse key=${deg} cx=${r+Math.cos(rad-Math.PI/2)*size*0.12} cy=${r+Math.sin(rad-Math.PI/2)*size*0.12} rx=${size*0.06} ry=${size*0.18} fill="#ff7a1f" transform=${`rotate(${deg} ${r} ${r})`}/>`;
      })}
      <circle cx=${r} cy=${r} r=${size*0.08} fill="#ffd700" stroke="#ff7a1f" stroke-width="1"/>
    </g>`;
  }
  return html`<g transform=${`translate(${x},${y})`}>
    <circle cx=${r} cy=${r} r=${r} fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <path d=${`M${r} ${r-size*0.28} L${r+size*0.08} ${r-size*0.06} L${r+size*0.3} ${r-size*0.06} L${r+size*0.13} ${r+size*0.07} L${r+size*0.2} ${r+size*0.28} L${r} ${r+size*0.15} L${r-size*0.2} ${r+size*0.28} L${r-size*0.13} ${r+size*0.07} L${r-size*0.3} ${r-size*0.06} L${r-size*0.08} ${r-size*0.06} Z`} fill="#94a3b8"/>
  </g>`;
}

function CardFooter({ W=1080, H=1080, time, mode='dark' }) {

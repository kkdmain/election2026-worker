<style>
/* Offline mode: use system Malayalam fonts with graceful fallbacks */
@font-face { font-family:'Noto Serif Malayalam'; src:local('Noto Serif Malayalam'),local('Noto Serif'),local('serif'); }
@font-face { font-family:'Noto Sans Malayalam'; src:local('Noto Sans Malayalam'),local('Noto Sans'),local('sans-serif'); }
@font-face { font-family:'Anek Malayalam Local'; src:local('Anek Malayalam'); }
@font-face { font-family:'Manjari'; src:local('Manjari'),local('Noto Sans Malayalam'),local('sans-serif'); }
@font-face { font-family:'Inter'; src:local('Inter'),local('Segoe UI'),local('Helvetica Neue'),local('Arial'),local('sans-serif'); }
@font-face { font-family:'JetBrains Mono'; src:local('JetBrains Mono'),local('Cascadia Code'),local('Consolas'),local('monospace'); }
</style>
<style>
/* MLU Malayalam Fonts — fallback to Noto Serif/Sans if not installed */
@font-face { font-family:'MLU-Vallari'; src:local('MLU-Vallari Regular'),local('MLU Vallari Regular'); }
@font-face { font-family:'MLU-Vijaya'; src:local('MLU Vijaya Regular'),local('MLU-Vijaya Regular'); }
@font-face { font-family:'MLU-Jwala'; src:local('MLU Jwala Bold'),local('MLU-Jwala Bold'); font-weight:700; }
@font-face { font-family:'MLU-Lekha'; src:local('MLU Lekha'),local('MLU-Lekha'); }
/* Title stack: MLU first, then quality fallbacks */
:root { --font-title:'Anek Malayalam',sans-serif; --font-display:'Anek Malayalam',sans-serif; --font-body:'Anek Malayalam',sans-serif; }
</style>
<style>
:root{
  --bg:#03051a; --bg2:#070b2a; --panel:rgba(13,20,55,.78); --panel2:rgba(20,28,68,.92);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16); --ink:#fff; --ink2:rgba(255,255,255,.72); --ink3:rgba(255,255,255,.5);
  --gold:#fbbf24; --gold2:#f59e0b; --green:#16a34a; --green2:#22c55e;
  --udf:#1e5dff; --udf2:#3b82f6; --ldf:#dc1f2e; --ldf2:#ef4444; --nda:#ff7a1f; --nda2:#fb923c; --oth:#94a3b8;
  --shadow:0 8px 32px rgba(0,0,0,.4); --shadow2:0 12px 48px rgba(0,0,0,.6);
  --r:8px; --r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--font-body),'Manjari','Noto Sans Malayalam','Inter',sans-serif;font-size:14px;line-height:1.4}
#root{height:100vh;width:100vw;overflow:hidden}
.ml-disp{font-family:var(--font-display),'Noto Serif Malayalam',serif;font-weight:800;letter-spacing:-.01em}
.ml-head{font-family:var(--font-title),'Anek Malayalam','Noto Sans Malayalam',sans-serif;font-weight:700}
.ml-body{font-family:var(--font-body),'Manjari','Noto Sans Malayalam',sans-serif;font-weight:700}
.ml{font-family:var(--font-body),'Noto Sans Malayalam','Anek Malayalam',sans-serif}
.en-disp{font-family:'Inter',sans-serif;font-weight:800;letter-spacing:-.02em}
.en{font-family:'Inter',sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700;font-variant-numeric:tabular-nums}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;color:#fff;background:rgba(0,0,0,.32);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;outline:none;transition:border .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(0,0,0,.5)}
input::placeholder{color:rgba(255,255,255,.32)}
/* Force the full app, admin, and generated SVG text to Anek Malayalam. */
html body, html body *, svg text, svg tspan{font-family:'Anek Malayalam',sans-serif!important;font-synthesis-weight:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32)}

/* === BG ATMOSPHERE === */
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(800px 500px at 18% 12%,rgba(30,93,255,.16),transparent 60%),
  radial-gradient(700px 460px at 82% 88%,rgba(220,31,46,.12),transparent 60%),
  radial-gradient(700px 460px at 50% 100%,rgba(251,191,36,.06),transparent 70%);
  pointer-events:none;z-index:0}

/* === SPLASH === */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 40%,#0a1340 0%,#03051a 70%);z-index:9000;animation:splashOut 0.4s ease 2.6s forwards}
.splash-logo{animation:splashLogo .9s cubic-bezier(.34,1.56,.64,1) both}
.splash-title{font-family:'Noto Serif Malayalam',serif;font-weight:800;font-size:34px;letter-spacing:.5px;background:linear-gradient(180deg,#fff,#fbbf24 95%);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;animation:splashUp .8s cubic-bezier(.16,1,.3,1) .35s both}
.splash-sub{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:15px;color:rgba(255,255,255,.5);letter-spacing:3px;text-transform:uppercase;animation:splashUp .8s cubic-bezier(.16,1,.3,1) .55s both}
.splash-bar{width:240px;height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;animation:splashUp .8s ease .7s both}
.splash-bar::after{content:'';display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,#fbbf24,transparent);animation:splashBar 1.6s linear infinite}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes splashLogo{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes splashUp{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes splashBar{0%{transform:translateX(-120%)}100%{transform:translateX(440%)}}

/* === APP SHELL === */
.app{position:relative;z-index:1;height:100vh;width:100vw;display:flex;flex-direction:column;overflow:hidden}
.dash{position:relative;z-index:1;height:100vh;width:100vw;display:flex;flex-direction:column;overflow:hidden}

/* === HEADER === */
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:10px 20px;background:linear-gradient(180deg,rgba(7,11,42,.95),rgba(7,11,42,.7));border-bottom:1px solid var(--line2);position:relative;z-index:2}
.hdr-l{display:flex;align-items:center;gap:14px}
.hdr-emblem{width:54px;height:54px;flex-shrink:0;filter:drop-shadow(0 4px 14px rgba(251,191,36,.32))}
.hdr-dio{display:flex;flex-direction:column;gap:1px}
.hdr-dio-ml{font-family:'Noto Serif Malayalam',serif;font-weight:700;font-size:13px;color:#fff;line-height:1.15}
.hdr-dio-en{font-family:'Inter',sans-serif;font-size:9px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:1.5px;text-transform:uppercase}
.hdr-c{display:flex;flex-direction:column;align-items:center;gap:2px}
.hdr-title{font-family:'Noto Serif Malayalam',serif;font-weight:800;font-size:26px;letter-spacing:.5px;background:linear-gradient(180deg,#fff 30%,#fbbf24 100%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.hdr-sub{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.5px}
.hdr-r{display:flex;align-items:center;gap:14px}
.hdr-eci{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px}
.hdr-eci svg{flex-shrink:0}
.hdr-eci-txt{display:flex;flex-direction:column;line-height:1.1}
.hdr-eci-ml{font-family:'Noto Serif Malayalam',serif;font-weight:700;font-size:11px;color:#fff}
.hdr-eci-en{font-family:'Inter',sans-serif;font-size:8px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:1px;text-transform:uppercase}
.hdr-live{display:flex;align-items:center;gap:8px;padding:7px 14px;background:linear-gradient(135deg,#dc2626,#991b1b);border-radius:99px;font-family:'Inter',sans-serif;font-weight:800;font-size:13px;letter-spacing:1.5px;animation:livePulse 1.6s ease infinite;box-shadow:0 4px 16px rgba(220,38,38,.45)}
.hdr-live::before{content:'';width:8px;height:8px;background:#fff;border-radius:50%;animation:liveDot 1s ease infinite}
@keyframes livePulse{50%{box-shadow:0 4px 24px rgba(220,38,38,.7)}}
@keyframes liveDot{50%{opacity:.3}}
.hdr-time{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.hdr-clock{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:#fbbf24;letter-spacing:.5px}
.hdr-date{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,.62)}

/* === MAIN GRID === */
.main{flex:1;display:grid;grid-template-columns:268px 1fr 304px;gap:8px;padding:8px;min-height:0;overflow:hidden}
.col{min-height:0;min-width:0;display:grid;gap:8px}
/* col-l: SeatTally(auto) + AnalyticsFlash(1fr) - explicit row sizing prevents flash collapse */
.col-l{grid-template-rows:auto auto 1fr}
/* col-c: LeadingCandidates(auto) + FlashCenter(1fr) */
.col-c{grid-template-rows:auto 1fr}
/* col-r: Breaking + candidate flash */
.col-r{grid-template-rows:minmax(165px,.62fr) minmax(300px,1fr)}
.col-r > .ins{max-height:200px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;display:flex;flex-direction:column;backdrop-filter:blur(8px);box-shadow:var(--shadow);min-height:0;min-width:0;overflow:hidden}
.col > .panel{height:100%;width:100%}
.panel.afl,.panel.flash-c,.panel.brk{flex:initial} /* override flex:1 since parent is grid now */
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--line);flex-shrink:0}
.panel-t{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:12px;color:rgba(255,255,255,.78);letter-spacing:.5px;text-transform:uppercase}
.panel-t-en{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;color:rgba(255,255,255,.78);letter-spacing:2px;text-transform:uppercase}
.panel-acc{display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .25s;padding:0;display:inline-block;flex:0 0 auto}
.dot.on{width:16px;background:#fbbf24}
.dot:hover{background:rgba(251,191,36,.7);transform:scale(1.18)}
.flash-controls{display:flex;align-items:center;gap:8px}
.flash-ctl{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.62);background:rgba(255,255,255,.04);border:1px solid var(--line);transition:all .15s;flex-shrink:0}
.flash-ctl:hover{color:#fbbf24;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35)}

/* === SEAT TALLY === */
.tally{flex-shrink:0}
.tally-rows{display:flex;flex-direction:column;gap:6px}
.tally-row{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:7px;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.tally-row.lead{background:linear-gradient(90deg,rgba(251,191,36,.16),rgba(251,191,36,.04));border-color:rgba(251,191,36,.5);box-shadow:0 0 18px rgba(251,191,36,.18) inset}
.tally-pty{font-family:'Inter',sans-serif;font-weight:800;font-size:12px;letter-spacing:.5px;padding:3px 6px;border-radius:4px;text-align:center;color:#fff}
.tally-bar{height:6px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;position:relative}
.tally-bar-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.tally-num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:18px;min-width:30px;text-align:right}
.tally-tot{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin-top:8px;background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(251,191,36,.04));border:1px solid rgba(251,191,36,.32);border-radius:8px}
.tally-tot-l{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:13px;color:#fbbf24}
.tally-tot-r{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:18px;color:#fbbf24}

/* === ANALYTICS FLASH === */
.afl{min-height:0;min-width:0;display:flex;flex-direction:column}
.afl-stage{flex:1;min-height:0;position:relative;overflow:hidden}
.afl-card{position:absolute;inset:0;display:flex;flex-direction:column;animation:aflIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes aflIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.afl-bignum{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;gap:2px}
.afl-bignum-l{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:13px;color:rgba(255,255,255,.62);letter-spacing:.5px}
.afl-bignum-n{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:38px;color:#fbbf24;line-height:1;letter-spacing:-1px}
.afl-bignum-s{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:11px;color:rgba(255,255,255,.5)}
.afl-chart-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0}
.afl-chart-wrap svg{width:100%;height:100%;max-height:200px}
.afl-chart-t{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:11px;color:rgba(255,255,255,.55);text-align:center;margin-top:4px;letter-spacing:.5px}

/* === LEADING CANDIDATES === */
.lead-row{flex-shrink:0}
.lead-marquee{height:238px;overflow:hidden;position:relative}
.lead-track{height:100%;display:flex;gap:10px;width:max-content;animation:leadScroll 76s linear infinite;will-change:transform}
.lead-row:hover .lead-track{animation-play-state:paused}
.lead-track.paused{animation-play-state:paused}

.kk-region-l{font-family:'Anek Malayalam','Noto Sans Malayalam',sans-serif;font-weight:700;font-size:11px;fill:#fff;text-anchor:middle;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.kk-leg{position:absolute;bottom:6px;left:6px;right:6px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:rgba(0,0,0,.36);padding:5px 10px;border-radius:6px;border:1px solid var(--line)}
.kk-leg-i{display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-weight:700;font-size:10px;color:#fff;letter-spacing:.5px}
.kk-leg-i .sw{width:11px;height:11px;border-radius:3px}

/* === LAC TABLE === */
.lac-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.lac-tab{flex:1;overflow:auto;border-radius:7px;border:1px solid var(--line)}
.lac{width:100%;border-collapse:collapse;font-size:12px}
.lac thead th{position:sticky;top:0;z-index:1;padding:6px 6px;font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:10px;letter-spacing:.4px;text-align:center;background:rgba(7,11,42,.98);white-space:nowrap}
.lac thead .pty{padding:5px 4px;font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff}
.lac thead .pty.udf{background:#1e5dff}.lac thead .pty.ldf{background:#dc1f2e}.lac thead .pty.nda{background:#ff7a1f}.lac thead .pty.oth{background:#64748b}
.lac thead .sub{padding:4px;background:rgba(7,11,42,.95);font-size:8.5px;color:rgba(255,255,255,.7)}
.lac thead .sub.r{background:rgba(251,191,36,.18);color:#fbbf24;font-weight:800}
.lac tbody td{padding:5px 6px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;text-align:right}
.lac tbody td.seg{font-family:'Noto Sans Malayalam',sans-serif;font-size:11px;text-align:left;color:#fff}
.lac tbody tr:hover{background:rgba(255,255,255,.04)}
.lac tbody td.r-cell{background:rgba(251,191,36,.06);color:#fde68a}
.lac tbody .tot td{background:rgba(255,255,255,.05);font-weight:800;font-size:12px;border-top:2px solid var(--line2)}
.lac tbody .tot td.seg{color:#fbbf24}
.lac tbody tr.postal td{background:rgba(34,197,94,.05);border-top:1px dashed rgba(34,197,94,.3)}
.lac tbody tr.postal td.seg{color:#22c55e}

/* === BREAKING FLASH (right) === */
.brk{min-height:0;min-width:0;display:flex;flex-direction:column}
.brk-stage{flex:1;min-height:0;position:relative;overflow:hidden}
.brk-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;border-radius:8px;animation:brkIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes brkIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.brk-card.kind-1{background:linear-gradient(135deg,rgba(220,31,46,.32),rgba(220,31,46,.08));border:1px solid rgba(220,31,46,.5)}
.brk-card.kind-2{background:linear-gradient(135deg,rgba(30,93,255,.32),rgba(30,93,255,.08));border:1px solid rgba(30,93,255,.5)}
.brk-card.kind-3{background:linear-gradient(135deg,rgba(22,163,74,.32),rgba(22,163,74,.08));border:1px solid rgba(22,163,74,.5)}
.brk-card.kind-4{background:linear-gradient(135deg,rgba(251,191,36,.28),rgba(251,191,36,.08));border:1px solid rgba(251,191,36,.5)}
.brk-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.32);margin-bottom:10px;animation:brkPulse 1.6s ease infinite}
@keyframes brkPulse{50%{transform:scale(1.08)}}
.brk-tag{font-family:'Inter',sans-serif;font-weight:800;font-size:10px;letter-spacing:2px;color:#fbbf24;margin-bottom:4px}
.brk-msg{font-family:'Noto Serif Malayalam',serif;font-weight:700;font-size:18px;color:#fff;line-height:1.3;margin-bottom:8px}
.brk-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.55);margin-top:auto}

/* === STATUS PANEL (right column small) === */
.stat{display:flex;flex-direction:column;gap:6px;flex-shrink:0;padding:9px 10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px}
.stat-l{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:10px;color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:.4px}
.stat-v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:13px;color:#fbbf24;margin-top:1px;line-height:1.1}
.stat-v.lg{font-size:18px}
.stat-tiny{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:9.5px;color:rgba(255,255,255,.45);margin-top:1px;line-height:1.1}
.pty-tag-r{font-family:'Inter',sans-serif;font-weight:800;font-size:10px;letter-spacing:1px;padding:3px 7px;border-radius:4px}
.pty-tag-r.udf{color:#1e5dff;background:rgba(30,93,255,.12);border:1px solid rgba(30,93,255,.32)}
.pty-tag-r.ldf{color:#ef4444;background:rgba(220,31,46,.12);border:1px solid rgba(220,31,46,.32)}
.pty-tag-r.nda{color:#ff9933;background:rgba(255,122,31,.12);border:1px solid rgba(255,122,31,.32)}
.pty-tag-r.oth{color:#94a3b8;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.32)}

/* === COUNTING PROGRESS CARD === */
.cprog{flex-shrink:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cprog-row{display:flex;flex-direction:column;gap:4px}
.cprog-label-row{display:flex;justify-content:space-between;align-items:baseline}
.cprog-label{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.5px}
.cprog-val{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:13px;color:#22c55e}
.cprog-val.rnd{color:#fbbf24}
.cprog-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.35)}
.cprog-track{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative}
.cprog-fill{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.16,1,.3,1)}
.cprog-fill.rnds{background:linear-gradient(90deg,#fbbf24,#d97706);box-shadow:0 0 6px rgba(251,191,36,.35)}

/* === INSIGHTS PANEL (Round-wise Cumulative) === */
.ins{flex-shrink:0;padding:8px 10px}
.ins-tab-wrap{flex:1;min-height:0;overflow:auto}
.ins-tab{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10px}
.ins-tab th{padding:4px 5px;text-align:right;background:rgba(251,191,36,.08);color:rgba(255,255,255,.7);font-weight:700;font-size:9.5px;border-bottom:1px solid var(--line);font-family:'Inter',sans-serif;letter-spacing:.4px}
.ins-tab th:first-child{text-align:left}
.ins-tab th.udf{color:#5b8def}.ins-tab th.ldf{color:#f87171}.ins-tab th.nda{color:#fb923c}.ins-tab th.gold{color:#fbbf24}
.ins-tab td{padding:4px 5px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.85)}
.ins-tab td:first-child{text-align:left;font-weight:700;font-family:'Anek Malayalam',sans-serif;color:#fbbf24;font-size:10px}
.ins-tab td.gold{color:#fbbf24;font-weight:800}
.ins-tab tr.postal-row td{background:rgba(251,191,36,.06);border-top:1px dashed rgba(251,191,36,.3)}
.ins-tab tr.postal-row td:first-child{color:#22c55e}

/* === AnalyticsFlash poll card === */
.afl-anim{animation:aflIn .55s cubic-bezier(.16,1,.3,1)}
.afl-poll{flex:1;display:flex;flex-direction:column;gap:10px;padding:8px}
.afl-poll-head{font-family:'Inter',sans-serif;font-weight:800;font-size:9.5px;color:rgba(255,255,255,.5);text-align:center;letter-spacing:1.2px;text-transform:uppercase;line-height:1.3}
.afl-poll-pct{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:36px;color:#22c55e;text-align:center;line-height:1;letter-spacing:-1px}
.afl-poll-bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;border:1px solid rgba(34,197,94,.2);width:100%}
.afl-poll-bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1);box-shadow:0 0 8px rgba(34,197,94,.4)}
.afl-poll-row{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:9px 11px;font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.035);border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.afl-poll-row b{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11.5px;color:#fff}
.afl-cons-line{display:flex;align-items:center;gap:6px;min-width:0}
.afl-cons-line b{font-family:'Anek Malayalam',sans-serif;font-size:11.5px;color:#fff;min-width:0;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2;overflow-wrap:anywhere}
.afl-party-tag{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 7px;border-radius:4px;background:var(--pc);color:#fff;font-family:'Inter',sans-serif;font-weight:900;font-size:8.5px;letter-spacing:1.2px;line-height:1;box-shadow:0 0 10px var(--pc);flex-shrink:0}
.afl-status-tag{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:4px;border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc);font-family:'Inter',sans-serif;font-weight:900;font-size:7.5px;letter-spacing:.9px;line-height:1;white-space:nowrap;flex-shrink:0}
.afl-candidate-name{font-family:'Anek Malayalam',sans-serif;font-weight:900;font-size:13.5px;color:rgba(255,255,255,.94);letter-spacing:.1px;line-height:1.18;min-width:0;white-space:normal;overflow-wrap:anywhere;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.afl-round-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(255,255,255,.68);font-weight:800;white-space:nowrap}

/* === TICKER === */
.tickr{flex-shrink:0;display:flex;align-items:center;gap:0;padding:0;background:linear-gradient(90deg,rgba(220,31,46,.32),rgba(7,11,42,.85));border-top:2px solid rgba(220,31,46,.6);height:38px;overflow:hidden}
.tickr-tag{flex-shrink:0;background:linear-gradient(135deg,#dc2626,#991b1b);padding:0 16px;height:100%;display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-weight:800;font-size:11px;letter-spacing:1.5px;color:#fff}
.tickr-tag::before{content:'';width:6px;height:6px;background:#fff;border-radius:50%;animation:liveDot 1s ease infinite}
.tickr-content{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.tickr-track{display:inline-flex;gap:36px;animation:tickrScroll 60s linear infinite;white-space:nowrap;padding-left:100%;font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;font-size:14px;color:#fff}
.tickr-track .item{display:inline-flex;align-items:center;gap:8px}
.tickr-track .item::before{content:'◆';color:#fbbf24;font-size:9px}
@keyframes tickrScroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* === UPDATE OVERLAY === */
.upd{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(circle at 50% 40%,rgba(10,19,64,.98),rgba(3,5,26,.99));z-index:7000;animation:updIn .25s ease both}
.upd.out{animation:updOut .35s ease forwards}
@keyframes updIn{from{opacity:0}to{opacity:1}}
@keyframes updOut{to{opacity:0;visibility:hidden}}
.upd-emblem{animation:updLogo .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes updLogo{0%{transform:scale(.5) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.upd-tag{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;letter-spacing:3px;color:#fbbf24;text-transform:uppercase;animation:updIn .5s ease .25s both;opacity:0;animation-fill-mode:forwards}
.upd-title{font-family:'Noto Serif Malayalam',serif;font-weight:800;font-size:30px;background:linear-gradient(180deg,#fff,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;animation:updUp .55s cubic-bezier(.16,1,.3,1) .35s both;opacity:0;animation-fill-mode:forwards}
.upd-target{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:15px;color:rgba(255,255,255,.78);animation:updUp .5s ease .55s both;opacity:0;animation-fill-mode:forwards}
@keyframes updUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.upd-bar{width:280px;height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;animation:updIn .4s ease .7s both;opacity:0;animation-fill-mode:forwards}
.upd-bar-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);width:0;animation:updFill 1.4s cubic-bezier(.4,0,.2,1) .8s forwards}
@keyframes updFill{to{width:100%}}

/* === FAB === */
.fab{position:fixed;bottom:54px;right:18px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 24px rgba(251,191,36,.4);z-index:50;transition:transform .15s,box-shadow .15s}
.fab:hover{transform:scale(1.08) rotate(45deg);box-shadow:0 12px 32px rgba(251,191,36,.6)}

/* === TOAST === */
.toast{position:fixed;bottom:60px;right:80px;padding:12px 18px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border-radius:8px;font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(22,163,74,.4);animation:toastIn .35s cubic-bezier(.16,1,.3,1);z-index:80}
.toast.err{background:linear-gradient(135deg,#dc2626,#991b1b);box-shadow:0 8px 30px rgba(220,38,38,.4)}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* === ADMIN === */
.adm-wrap{position:fixed;inset:0;background:rgba(3,5,26,.98);z-index:200;display:flex;animation:admIn .35s ease}
@keyframes admIn{from{opacity:0}to{opacity:1}}
.adm-side{width:240px;background:linear-gradient(180deg,#070b2a,#03051a);border-right:1px solid var(--line2);padding:18px 0;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.adm-brand{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.adm-brand svg{flex-shrink:0;width:36px;height:36px}
.adm-brand-t{font-family:'Inter',sans-serif;font-weight:800;font-size:12px;letter-spacing:2px;color:#fbbf24}
.adm-brand-s{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.5px}
.adm-user{padding:10px 18px;margin:0 12px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:10px}
.adm-user-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:14px;color:#1a1a1a}
.adm-user-info{flex:1;min-width:0}
.adm-user-n{font-size:13px;font-weight:700;color:#fff;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2;overflow-wrap:anywhere}
.adm-user-r{font-size:10px;color:#fbbf24;font-family:'Inter',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.adm-nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:2px}
.adm-nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:rgba(255,255,255,.62);transition:all .15s;text-align:left;width:100%}
.adm-nav-i:hover{background:rgba(255,255,255,.04);color:#fff}
.adm-nav-i.active{background:linear-gradient(90deg,rgba(251,191,36,.16),rgba(251,191,36,.04));color:#fbbf24;border-left:2px solid #fbbf24;padding-left:10px}
.adm-nav-i svg{flex-shrink:0}
.adm-nav-i.disabled{opacity:.3;cursor:not-allowed}
.adm-nav-bot{padding:0 12px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.adm-logout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;color:#fca5a5;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;transition:all .15s;width:100%;text-align:left}
.adm-logout:hover{background:rgba(220,38,38,.12);color:#fca5a5}

.adm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.adm-top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(7,11,42,.6),transparent)}
.adm-top-l{display:flex;flex-direction:column;gap:2px}
.adm-top-t{font-family:'Inter',sans-serif;font-weight:800;font-size:18px;color:#fff;letter-spacing:.5px}
.adm-top-s{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:12px;color:rgba(255,255,255,.55)}
.adm-top-r{display:flex;align-items:center;gap:10px}
.adm-close{padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:6px;transition:all .15s}
.adm-close:hover{background:rgba(255,255,255,.08);color:#fff}
.adm-body{flex:1;padding:18px 22px;overflow:auto}
.adm-blk{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:rgba(255,255,255,.78);margin-bottom:8px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.adm-blk-h{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.adm-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.adm-grid{display:grid;gap:12px}
.adm-grid.c2{grid-template-columns:repeat(2,1fr)}
.adm-grid.c3{grid-template-columns:repeat(3,1fr)}
.adm-grid.c4{grid-template-columns:repeat(4,1fr)}
.adm-fld{display:flex;flex-direction:column;gap:5px}
.adm-fld label{font-family:'Inter',sans-serif;font-weight:600;font-size:10px;color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:1.2px}
.adm-btn{padding:9px 16px;border-radius:7px;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .15s;cursor:pointer}
.adm-btn.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;box-shadow:0 4px 14px rgba(251,191,36,.32)}
.adm-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(251,191,36,.5)}
.adm-btn.green{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
.adm-btn.blue{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
.adm-btn.red{background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.adm-btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line2);color:rgba(255,255,255,.78)}
.adm-btn.ghost:hover{background:rgba(255,255,255,.08);color:#fff}
.adm-tab{width:100%;border-collapse:collapse;font-size:13px}
.adm-tab th{padding:10px 12px;font-family:'Inter',sans-serif;font-weight:700;font-size:10px;color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:1.5px;text-align:left;border-bottom:1px solid var(--line2);background:var(--bg2);position:sticky;top:0;z-index:2}
.adm-tab td{padding:10px 12px;border-bottom:1px solid var(--line);color:#fff;font-size:13px;font-family:'Noto Sans Malayalam','Inter',sans-serif}
.adm-tab td.num{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right}
.adm-tab tr:hover td{background:rgba(255,255,255,.03)}
.adm-tab .pty-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-family:'Inter',sans-serif;font-weight:800;font-size:10px;letter-spacing:.5px;color:#fff}
.adm-tab .pty-tag.udf{background:#1e5dff}.adm-tab .pty-tag.ldf{background:#dc1f2e}.adm-tab .pty-tag.nda{background:#ff7a1f}.adm-tab .pty-tag.oth{background:#64748b}

/* dashboard mini cards */
.adm-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.adm-mini-c{padding:14px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:10px}
.adm-mini-l{font-family:'Inter',sans-serif;font-weight:600;font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.adm-mini-v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:#fbbf24}
.adm-mini-s{font-family:'Inter',sans-serif;font-size:11px;color:rgba(255,255,255,.5);margin-top:4px}

/* === ADMIN LAC BREAKDOWN — compact two-column grid === */
.lac-bd{padding-bottom:18px}
.adm-grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:980px){.adm-grid-2{grid-template-columns:1fr}}
.adm-card-tight{padding:14px 16px;margin-bottom:0}
.adm-card-tight .adm-card-t{margin-bottom:11px}
.adm-form-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-bottom:12px}
@media (max-width:540px){.adm-form-grid{grid-template-columns:1fr}}
.adm-vote-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.adm-vote-fld{display:flex;flex-direction:column;gap:4px}
.adm-vote-l{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-weight:800;font-size:11px;letter-spacing:.5px;padding:0 2px}
.adm-vote-l.udf{color:#5b8def}.adm-vote-l.ldf{color:#f87171}.adm-vote-l.nda{color:#fb923c}.adm-vote-l.oth{color:#94a3b8}
.adm-vote-fld input{padding:9px 11px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;text-align:right;width:100%;min-width:0}
.adm-cum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.18);border-radius:7px;margin-top:6px}
.adm-cum-row.gold{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.22)}
.adm-cum-l{font-family:'Anek Malayalam',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,.7)}
.adm-cum-v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:15px;color:#fbbf24}
.adm-cum-v.gold{color:#fbbf24}
.adm-bar-r{display:flex;justify-content:flex-end;margin-top:10px}
.adm-badge{display:inline-block;margin-left:8px;padding:2px 7px;background:rgba(34,197,94,.16);color:#22c55e;font-family:'Inter',sans-serif;font-weight:800;font-size:9px;letter-spacing:1.2px;border-radius:4px;border:1px solid rgba(34,197,94,.3);vertical-align:middle}
.adm-tab.compact th{padding:7px 10px;font-size:9.5px}
.adm-tab.compact td{padding:7px 10px;font-size:12px}
.adm-tab tr.sel td{background:rgba(251,191,36,.08)}
.icon-only{padding:7px 9px;min-width:auto}

/* === CANDIDATE UPLOAD UI === */
.cand-upload-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.cand-upload-cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px}
.cand-upload-cell label{font-family:'Inter',sans-serif;font-weight:700;font-size:10px;color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:1.2px;text-align:center}
.cand-upload-prev{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.15)}
.cand-upload-prev.sm{width:80px;height:80px}
.cand-upload-actions{display:flex;gap:6px;align-items:center}
.adm-btn.sm{padding:6px 11px;font-size:11px}
.cand-upload-hint{font-family:'Inter',sans-serif;font-size:9.5px;color:rgba(255,255,255,.4);text-align:center;letter-spacing:.3px}
.modal{max-width:640px}

/* helper styles */
.adm-tab tr.sel td{background:rgba(251,191,36,.06)}

/* social card preview */
.sc-stage{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.sc-preview{background:rgba(0,0,0,.32);border:1px solid var(--line2);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:600px;position:relative;overflow:hidden}
.sc-frame{display:block;max-width:100%;max-height:600px;height:auto;width:auto;border-radius:6px;box-shadow:0 16px 50px rgba(0,0,0,.55)}
.sc-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sc-tab{padding:9px 14px;border-radius:7px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-family:'Inter',sans-serif;font-weight:700;font-size:11px;color:rgba(255,255,255,.78);letter-spacing:.5px;transition:all .15s}
.sc-tab:hover{background:rgba(255,255,255,.06);color:#fff}
.sc-tab.on{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;border-color:#fbbf24;box-shadow:0 4px 14px rgba(251,191,36,.32)}
.sc-info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;font-family:'Inter',sans-serif;font-size:12px}
.sc-info b{color:rgba(255,255,255,.62);font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.sc-info span{color:#fff;font-weight:700}
.sc-actions{display:flex;flex-direction:column;gap:8px}

/* settings page */
.set-grp{margin-bottom:18px}
.set-grp-t{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;color:#fbbf24;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.set-row{display:grid;grid-template-columns:1fr 200px;gap:16px;align-items:center;padding:10px 0}
.set-row-l{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:#fff}
.set-row-s{font-family:'Anek Malayalam',sans-serif;font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.toggle{position:relative;width:42px;height:22px;background:rgba(255,255,255,.12);border-radius:99px;cursor:pointer;transition:background .2s}
.toggle.on{background:#fbbf24}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle.on::after{transform:translateX(20px)}

/* candidate management */
.cand-card{display:grid;grid-template-columns:60px 1fr auto;gap:14px;padding:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;align-items:center;margin-bottom:8px}
.cand-card .av{width:60px;height:60px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.cand-card .info{display:flex;flex-direction:column;gap:3px}
.cand-card .info .n{font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;font-size:14px;color:#fff}
.cand-card .info .p{font-family:'Inter',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,.62)}
.cand-card .acts{display:flex;gap:6px}

/* round selector */
.rsel{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:rgba(0,0,0,.32)}
.rsel button{padding:7px 11px;background:transparent;color:rgba(255,255,255,.78);font-family:'Inter',sans-serif;font-weight:700;font-size:12px;transition:all .12s;display:flex;align-items:center;justify-content:center}
.rsel button:hover:not(:disabled){background:rgba(255,255,255,.06)}
.rsel button:disabled{opacity:.3;cursor:not-allowed}
.rsel .cur{padding:7px 14px;background:rgba(251,191,36,.16);color:#fbbf24;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* modal */
.mdl{position:fixed;inset:0;background:rgba(3,5,26,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;animation:admIn .25s ease}
.mdl-card{background:linear-gradient(180deg,#0a1340,#070b2a);border:1px solid var(--line2);border-radius:14px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.mdl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mdl-t{font-family:'Inter',sans-serif;font-weight:800;font-size:16px;color:#fff}
.mdl-x{padding:6px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;color:rgba(255,255,255,.62);font-size:12px}
.mdl-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

/* admin extra: bar/input/note + party picker + login + adm card titles */
.adm-bar{display:flex;align-items:flex-end;gap:12px;padding:12px 14px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.adm-inp{padding:8px 11px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:7px;color:#fff;font-family:'Noto Sans Malayalam','Inter',sans-serif;font-size:13px;font-weight:600;outline:none;min-width:160px;transition:border-color .15s,box-shadow .15s}
.adm-inp:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.18)}
.adm-inp.num{font-family:'JetBrains Mono',monospace}
select.adm-inp{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,rgba(255,255,255,.55) 50%),linear-gradient(135deg,rgba(255,255,255,.55) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;appearance:none;-webkit-appearance:none}
select.adm-inp option{background:#0a1340;color:#fff}
textarea.adm-inp{resize:vertical;min-height:80px;font-family:'Noto Sans Malayalam','Anek Malayalam',sans-serif}
.adm-card-t{font-family:'Inter',sans-serif;font-weight:800;font-size:13px;color:#fff;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.adm-note{margin-top:10px;padding:9px 12px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:7px;display:flex;align-items:center;gap:8px;font-family:'Anek Malayalam',sans-serif;font-size:12px;color:rgba(251,191,36,.92)}
.pty-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pty-pick-i{padding:9px 8px;border-radius:7px;border:1px solid var(--line2);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.78);font-family:'Inter',sans-serif;font-size:11px;font-weight:700}
.pty-pick-i:hover{background:rgba(255,255,255,.06);color:#fff}
.pty-pick-i.on{background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(251,191,36,.05));border-color:#fbbf24;color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.16)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,5,26,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;animation:admIn .25s ease}
.modal{background:linear-gradient(180deg,#0a1340,#070b2a);border:1px solid var(--line2);border-radius:14px;max-width:580px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-t{font-family:'Inter',sans-serif;font-weight:800;font-size:16px;color:#fff}
.modal-x{padding:6px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;color:rgba(255,255,255,.62);font-size:12px;cursor:pointer;display:inline-flex;align-items:center}
.modal-x:hover{background:rgba(255,255,255,.08);color:#fff}
.modal-b{padding:18px 22px;overflow:auto;flex:1}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:rgba(0,0,0,.2)}
/* login screen */
.login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a1340,#03051a 70%);z-index:9000;padding:20px}
.login-card{background:linear-gradient(180deg,rgba(10,19,64,.92),rgba(7,11,42,.96));border:1px solid rgba(251,191,36,.28);border-radius:16px;padding:30px 32px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(251,191,36,.08);animation:loginUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes loginUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.login-emblem{display:flex;justify-content:center;margin-bottom:14px}
.login-dio{font-family:'Anek Malayalam',sans-serif;font-weight:700;font-size:12px;color:rgba(251,191,36,.85);text-align:center;letter-spacing:.5px;margin-bottom:6px}
.login-title{font-family:'Noto Serif Malayalam',serif;font-weight:800;font-size:21px;text-align:center;background:linear-gradient(180deg,#fff,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.login-sub{font-family:'Inter',sans-serif;font-weight:700;font-size:10px;text-align:center;color:rgba(255,255,255,.5);letter-spacing:2.5px;margin:8px 0 22px;text-transform:uppercase}
.login-field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.login-field label{font-family:'Inter',sans-serif;font-weight:700;font-size:10px;color:rgba(255,255,255,.62);letter-spacing:1.4px;text-transform:uppercase}
.login-field input{width:100%;padding:11px 13px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:8px;color:#fff;font-family:'Inter','Noto Sans Malayalam',sans-serif;font-size:14px;font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s}
.login-field input:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.18)}
.login-btn{width:100%;padding:12px;border-radius:8px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;font-family:'Inter',sans-serif;font-weight:800;font-size:13px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s,box-shadow .15s;margin-top:6px;border:none}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(251,191,36,.5)}
.login-err{margin-top:10px;padding:9px 12px;background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.32);border-radius:7px;color:#fca5a5;font-family:'Anek Malayalam','Inter',sans-serif;font-size:11px;font-weight:600;text-align:center}
.login-foot{margin-top:18px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.1);text-align:center;display:flex;flex-direction:column;gap:4px}
.login-foot span{font-family:'Inter',sans-serif;font-size:10.5px;color:rgba(255,255,255,.42);letter-spacing:.3px}
.login-foot span:first-child{color:rgba(251,191,36,.7);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;font-size:10px}
/* helpers */
.hidden{display:none!important}
.flex{display:flex}.col-flex{display:flex;flex-direction:column}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}
.center{align-items:center;justify-content:center}.between{justify-content:space-between}
.flex-1{flex:1;min-width:0}.shrink-0{flex-shrink:0}
.muted{color:rgba(255,255,255,.55)}
.gold{color:#fbbf24}
.t-c{text-align:center}.t-r{text-align:right}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
</style>

<script>
/* Pull globals from UMD bundles */
const { h, render } = window.preact;
const { useState, useEffect, useRef, useMemo, useCallback } = window.preactHooks;
const html = window.htm.bind(h);

/* ====================================================================
   SUPABASE CLIENT — URL/KEY loaded from <meta> tags (no hardcoding)
   Add to your HTML <head>:
     <meta name="supa-url" content="YOUR_SUPABASE_URL">
     <meta name="supa-key" content="YOUR_SUPABASE_ANON_KEY">
   ==================================================================== */
/* ============================================================
   RECOMMENDED: Run these in Supabase SQL Editor for best performance:
   CREATE INDEX IF NOT EXISTS idx_crv_cons_id ON candidate_round_votes(cons_id);
   CREATE INDEX IF NOT EXISTS idx_crv_cand_id ON candidate_round_votes(candidate_id);
   CREATE INDEX IF NOT EXISTS idx_candidates_cons ON candidates(cons_id);
   ============================================================ */
const _metaUrl = document.querySelector('meta[name="supa-url"]')?.content;
const _metaKey = document.querySelector('meta[name="supa-key"]')?.content;
const _supaLib = window.supabase || window.Supabase;
const supa = (_supaLib?.createClient && _metaUrl && _metaKey)
  ? _supaLib.createClient(_metaUrl, _metaKey, {
      auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false },
      realtime: { params: { eventsPerSecond: 10 } }
    })
  : null;
if (!supa) console.warn('Supabase not initialized — database-backed data cannot load.');

/* ── helpers ── */
async function supaUpsert(table, data, conflict='id') {
  if (!supa) return;
  try { const r = await supa.from(table).upsert(data, { onConflict: conflict }); if (r.error) throw r.error; } catch(e) { console.warn('supaUpsert', table, e); }
}
async function supaUpsertBatch(table, rows, conflict='id') {
  if (!supa || !rows.length) return;
  try { const r = await supa.from(table).upsert(rows, { onConflict: conflict }); if (r.error) throw r.error; } catch(e) { console.warn('supaUpsertBatch', table, e); }
}
async function supaInsertBatch(table, rows) {
  if (!supa || !rows.length) return;
  try { const r = await supa.from(table).insert(rows); if (r.error) throw r.error; } catch(e) { console.warn('supaInsertBatch', table, e); }
}
async function supaSaveRoundVotes(consId, rows) {
  if (!supa) return;
  let r = await supa.from('candidate_round_votes').delete().eq('cons_id', consId);
  if (r.error) throw r.error;
  if (rows.length) {
    r = await supa.from('candidate_round_votes').upsert(rows, { onConflict: 'candidate_id,round_number' });
    if (r.error) throw r.error;
  }
}
function withDbTimeout(promise, label, ms=20000) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => {
      console.info('DB load timeout', label);
      resolve({ data:null, error:new Error('timeout') });
    }, ms))
  ]);
}

const TABLE_SELECT = {
  constituencies: 'id,name_ml,name_en,completed_rounds,total_rounds,counting_status',
  candidates: 'id,cons_id,name_ml,party,photo_seed,postal_votes',
  candidate_round_votes: 'candidate_id,cons_id,round_number,votes',
  lac_segments: 'id,name_ml,name_en,current_round,udf_current,ldf_current,nda_current,oth_current,udf_total,ldf_total,nda_total,oth_total,rounds_json',
  ticker_messages: 'id,message,sort_order',
  announcements: 'id,kind,message,tag,sort_order',
  app_users: 'id,name,email,password_plain,role,active',
  app_settings: 'id,show_map,show_lac_labels,auto_rotate,flash_interval,animations,font,ticker_speed,theme,total_voters_polled,voters_polled_by_cons'
};

const DATA_IMAGE_RE = /^data:image\/(?:png|jpe?g|webp|gif|svg\+xml);base64,[a-z0-9+/=\s]+$/i;
const MAX_INLINE_IMAGE_URL = 3000000;
function safeImageUrl(value) {
  const url = String(value || '').trim();
  if (!url) return '';
  if (url.startsWith('data:image/')) {
    return url.length <= MAX_INLINE_IMAGE_URL && DATA_IMAGE_RE.test(url) ? url : '';
  }
  if (/^(https?:|blob:)/i.test(url)) return url;
  if (/^(?:\.{0,2}\/|[a-z0-9_-]+\/)[^\s"'<>]+$/i.test(url)) return url;
  return '';
}

async function supaLoad(table, columns=TABLE_SELECT[table] || '*') {
  if (!supa) return null;
  try { const { data, error } = await withDbTimeout(supa.from(table).select(columns), table); if (error) throw error; return data; } catch(e) { console.warn('supaLoad', table, e); return null; }
}
async function supaLoadSorted(table, col, asc=true, columns=TABLE_SELECT[table] || '*') {
  if (!supa) return null;
  try { const { data, error } = await withDbTimeout(supa.from(table).select(columns).order(col, { ascending: asc }), table); if (error) throw error; return data; } catch(e) { console.warn('supaLoadSorted', table, e); return null; }
}
async function supaDelete(table, id) {
  if (!supa) return;
  try { const r = await supa.from(table).delete().eq('id', id); if (r.error) throw r.error; } catch(e) { console.warn('supaDelete', table, e); }
}
async function supaDeleteWhere(table, filters) {
  if (!supa) return;
  try {
    let q = supa.from(table).delete();
    Object.entries(filters || {}).forEach(([col, val]) => { q = q.eq(col, val); });
    const r = await q;
    if (r.error) throw r.error;
  } catch(e) { console.warn('supaDeleteWhere', table, e); }
}
async function supaUpdateWhere(table, values, filters) {
  if (!supa) return;
  try {
    let q = supa.from(table).update(values);
    Object.entries(filters || {}).forEach(([col, val]) => { q = q.eq(col, val); });
    const r = await q;
    if (r.error) throw r.error;
  } catch(e) { console.warn('supaUpdateWhere', table, e); }
}

/* ── DB → app shape converters ── */
function dbToConstituency(row) {
  return {
    id: row.id,
    name_ml: row.name_ml,
    name_en: row.name_en,
    round: row.completed_rounds || 0,
    total: row.total_rounds || 15,
    completedRounds: row.completed_rounds || 0,
    totalRounds: row.total_rounds || 15,
    countingStatus: row.counting_status || 'live',
  };
}
function dbToCandidate(row, roundRows) {
  const myRows = Array.isArray(roundRows) ? roundRows : (roundRows?.get?.(row.id) || []);
  const myRounds = myRows.filter(r => r.round_number > 0);
  const postal = myRows.find(r => r.round_number === 0);
  const rounds = {};
  myRounds.forEach(r => { rounds[r.round_number] = r.votes; });
  const postalVotes = postal?.votes ?? row.postal_votes ?? 0;
  const totalVotes = myRounds.reduce((s,r)=>s+r.votes,0) + postalVotes;
  return {
    id: row.id,
    consId: row.cons_id,
    name: row.name_ml,
    name_ml: row.name_ml,
    party: row.party,
    votes: totalVotes,
    postalVotes,
    photoSeed: row.photo_seed || '',
    photoUrl: safeImageUrl(row.photo_url),
    symbolUrl: safeImageUrl(row.symbol_url),
    rounds,
  };
}
function dbToSegment(row) {
  let rounds = {};
  try { rounds = typeof row.rounds_json === 'string' ? JSON.parse(row.rounds_json) : (row.rounds_json || {}); } catch(e){}
  return {
    id: row.id,
    name: row.name_ml,
    en: row.name_en,
    round: row.current_round || 0,
    udf: row.udf_current || 0,
    ldf: row.ldf_current || 0,
    nda: row.nda_current || 0,
    oth: row.oth_current || 0,
    udf_t: row.udf_total || 0,
    ldf_t: row.ldf_total || 0,
    nda_t: row.nda_total || 0,
    oth_t: row.oth_total || 0,
    rounds,
  };
}
function dbToUser(row) {
  return { id: row.id, name: row.name, email: row.email, password: row.password_plain, role: row.role, active: row.active !== false };
}
function dbToSettings(row) {
  let votersPolledByCons = {};
  try { votersPolledByCons = typeof row.voters_polled_by_cons === 'string' ? JSON.parse(row.voters_polled_by_cons) : (row.voters_polled_by_cons || {}); } catch(e){}
  return {
    showMap: row.show_map !== false,
    showLACLabels: row.show_lac_labels !== false,
    autoRotate: row.auto_rotate !== false,
    flashInterval: row.flash_interval || 8,
    animations: row.animations !== false,
    font: row.font || 'noto-serif',
    tickerSpeed: row.ticker_speed || 35,
    theme: row.theme || 'dark',
    totalVotersPolled: row.total_voters_polled || 0,
    votersPolledByCons,
  };
}

/* ── app shape → DB row converters ── */
function constituencyToDb(c) {
  return {
    id: c.id,
    name_ml: c.name_ml,
    name_en: c.name_en,
    completed_rounds: c.completedRounds || c.round || 0,
    total_rounds: c.totalRounds || c.total || 15,
    counting_status: c.countingStatus || 'live',
  };
}
function candidateToDb(c) {
  return {
    id: c.id,
    cons_id: c.consId,
    name_ml: c.name || c.name_ml,
    party: c.party,
    photo_url: c.photoUrl || '',
    symbol_url: c.symbolUrl || '',
    photo_seed: c.photoSeed || '',
    postal_votes: c.postalVotes || 0,
  };
}
function segmentToDb(s) {
  return {
    id: s.id,
    name_ml: s.name,
    name_en: s.en,
    current_round: s.round || 0,
    udf_current: s.udf || 0,
    ldf_current: s.ldf || 0,
    nda_current: s.nda || 0,
    oth_current: s.oth || 0,
    udf_total: s.udf_t || 0,
    ldf_total: s.ldf_t || 0,
    nda_total: s.nda_t || 0,
    oth_total: s.oth_t || 0,
    rounds_json: JSON.stringify(s.rounds || {}),
  };
}
function userToDb(u) {
  return { id: u.id, name: u.name, email: u.email, password_plain: u.password, role: u.role, active: u.active !== false };
}
function settingsToDb(s) {
  return {
    id: 1,
    show_map: s.showMap,
    show_lac_labels: s.showLACLabels,
    auto_rotate: s.autoRotate,
    flash_interval: s.flashInterval,
    animations: s.animations,
    font: s.font,
    ticker_speed: s.tickerSpeed,
    theme: s.theme,
    total_voters_polled: s.totalVotersPolled,
    voters_polled_by_cons: JSON.stringify(s.votersPolledByCons || {}),
  };
}

/* ── bootstrap: load everything from DB ── */
const DB_CACHE_KEY = 'dio_db_cache_v1';
function saveDbCache(db) {
  try { localStorage.setItem(DB_CACHE_KEY, JSON.stringify({ t:Date.now(), db })); } catch(e) {}
}
function loadDbCache(maxAgeMs=1000*60*60*12) {
  try {
    const raw = localStorage.getItem(DB_CACHE_KEY);
    if (!raw) return null;
    const cached = JSON.parse(raw);
    if (!cached?.db || Date.now() - (cached.t || 0) > maxAgeMs) return null;
    return cached.db;
  } catch(e) { return null; }
}

function buildCandidatesFromRows(candRows, roundRows) {
  const roundByCandidate = new Map();
  (roundRows || []).forEach(r => {
    const arr = roundByCandidate.get(r.candidate_id);
    if (arr) arr.push(r);
    else roundByCandidate.set(r.candidate_id, [r]);
  });
  return (candRows || []).map(r => dbToCandidate(r, roundByCandidate));
}

function hydrateCandidateImages(candidates, imageRows) {
  const images = new Map();
  (imageRows || []).forEach(r => {
    images.set(r.id, {
      photoUrl: safeImageUrl(r.photo_url || r.photoUrl),
      symbolUrl: safeImageUrl(r.symbol_url || r.symbolUrl)
    });
  });
  return (candidates || []).map(c => {
    const img = images.get(c.id);
    return img ? { ...c, ...img } : c;
  });
}

async function loadCandidateImagesFromDB() {
  const rows = await supaLoad('candidates', 'id,photo_url,symbol_url');
  return rows || [];
}

async function loadCandidatesFromDB() {
  const [candRows, roundRows] = await Promise.all([
    supaLoad('candidates'),
    supaLoad('candidate_round_votes'),
  ]);
  if (!candRows) return null;
  return buildCandidatesFromRows(candRows, roundRows);
}

async function loadAllFromDB() {
  if (!supa) return null;

  // Phase 1 — critical display data (fast path, shown immediately)
  const [consRows, candRows, roundRows, tickerRows, announceRows, settingsRows] = await Promise.all([
    supaLoad('constituencies'),
    supaLoad('candidates'),
    supaLoad('candidate_round_votes'),
    supaLoadSorted('ticker_messages', 'sort_order', true),
    supaLoadSorted('announcements', 'sort_order', true),
    supaLoad('app_settings'),
  ]);
  if (!consRows) return null; // DB not yet set up

  const constituencies = (consRows || []).map(dbToConstituency);
  const candidates = buildCandidatesFromRows(candRows, roundRows);
  const ticker = (tickerRows || []).map(r => r.message);
  const announcements = (announceRows || []).map(r => ({ id: r.id, kind: r.kind || 1, msg: r.message, tag: r.tag || 'BREAKING' }));
  const settings = settingsRows && settingsRows[0] ? dbToSettings(settingsRows[0]) : null;
  // Store raw round rows so realtime can patch them without a re-fetch
  const rawRoundRows = roundRows || [];

  // Phase 2 — secondary data loaded in background (segments + users)
  const phase2 = Promise.all([
    supaLoad('lac_segments'),
    supaLoad('app_users'),
    loadCandidateImagesFromDB(),
  ]);

  const db = { constituencies, candidates, segments: [], ticker, announcements, users: [], settings, rawRoundRows, _phase2: phase2 };
  return db;
}

function fmtIN(n) {
  if (n == null || isNaN(n)) return '0';
  const s = Math.abs(Math.round(+n)).toString();
  if (s.length <= 3) return (n<0?'-':'')+s;
  const last3 = s.slice(-3);
  const rest = s.slice(0, -3);
  return (n<0?'-':'') + rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
}
const pad2 = n => String(n).padStart(2,'0');
function fmtTime(d) {
  let h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  const ap = h>=12 ? 'PM':'AM';
  h = h%12 || 12;
  return `${pad2(h)}:${pad2(m)}:${pad2(s)} ${ap}`;
}
function fmtTimeShort(d) {
  let h = d.getHours(), m = d.getMinutes();
  const ap = h>=12 ? 'PM':'AM';
  h = h%12 || 12;
  return `${pad2(h)}:${pad2(m)} ${ap}`;
}
function fmtDateML(d) { return `${pad2(d.getDate())} ${ML_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

function useClock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function seatTallyFrom(constituencies, candidates) {
  const tally = { UDF:0, LDF:0, NDA:0, OTH:0 };
  for (const c of constituencies) {
    const cands = candidates
      .filter(k => k.consId === c.id && (parseInt(k.votes, 10) || 0) > 0)
      .sort((a,b) => (parseInt(b.votes,10)||0) - (parseInt(a.votes,10)||0));
    if (cands.length) tally[cands[0].party] = (tally[cands[0].party]||0) + 1;
  }
  return tally;
}
function totalsFrom(candidates) {
  const t = { UDF:0, LDF:0, NDA:0, OTH:0 };
  for (const c of candidates) t[c.party] = (t[c.party]||0) + (c.votes||0);
  return t;
}
function leadFor(consId, candidates) {
  const cs = candidates
    .filter(k => k.consId === consId && (parseInt(k.votes, 10) || 0) > 0)
    .sort((a,b) => (parseInt(b.votes,10)||0) - (parseInt(a.votes,10)||0));
  if (!cs.length) return { leader:null, margin:0 };
  if (cs.length < 2) return { leader:cs[0], margin:parseInt(cs[0].votes,10)||0 };
  return { leader:cs[0], margin: (parseInt(cs[0].votes,10)||0) - (parseInt(cs[1].votes,10)||0) };
}

function Icon({d, size=16, stroke='currentColor', sw=2, fill='none'}) {
  return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill=${fill} stroke=${stroke} stroke-width=${sw} stroke-linecap="round" stroke-linejoin="round"><path d=${d}/></svg>`;
}

function FlashControls({ count=0, idx=0, paused=false, onToggle, onSeek, iconSize=12, labels=[] }) {
  if (count <= 0) return null;
  const active = ((idx % count) + count) % count;
  const prev = (active - 1 + count) % count;
  const next = (active + 1) % count;
  const prevLabel = labels[prev] || 'Previous page';
  const nextLabel = labels[next] || 'Next page';
  return html`<div class="flash-controls">
    ${onToggle ? html`<button class="flash-ctl" type="button" title=${paused?'Play flash cards':'Pause flash cards'} aria-label=${paused?'Play flash cards':'Pause flash cards'} onClick=${onToggle}>
      <${Icon} d=${paused?I.play:I.pause} size=${iconSize}/>
    </button>` : null}
    ${onSeek && count > 1 ? html`<button class="flash-ctl" type="button" title=${`Previous: ${prevLabel}`} aria-label=${`Previous: ${prevLabel}`} onClick=${() => onSeek(prev)}>
      <${Icon} d=${I.chev_l} size=${iconSize}/>
    </button>` : null}
    <div class="panel-acc">
      ${Array.from({length:count}).map((_,i) => {
        const label = labels[i] || labels[active] || '';
        return html`<button
          type="button"
          class=${`dot ${active===i?'on':''}`}
          title=${label}
          aria-label=${label}
          aria-current=${active===i?'true':'false'}
          onClick=${() => onSeek && onSeek(i)}
        ></button>`;
      })}
    </div>
    ${onSeek && count > 1 ? html`<button class="flash-ctl" type="button" title=${`Next: ${nextLabel}`} aria-label=${`Next: ${nextLabel}`} onClick=${() => onSeek(next)}>
      <${Icon} d=${I.chev_r} size=${iconSize}/>
    </button>` : null}
  </div>`;
}

function DIOEmblem({ size=54, dark=true }) {
  /* dark=true (dashboard) inverts the alpha-PNG to white/gold via CSS filter; dark=false (admin/social cards) keeps it black */
  const filter = dark
    ? "invert(94%) sepia(48%) saturate(745%) hue-rotate(355deg) brightness(102%) contrast(101%) drop-shadow(0 2px 6px rgba(251,191,36,.35))"
    : "none";
  return html`<img src="data:image/png;base64,${DIO_EMBLEM_B64}" width=${size} height=${Math.round(size*0.91)} alt="DIO Kozhikode" style=${`display:block;filter:${filter};object-fit:contain`}/>`;
}

/* ====================================================================
   ANIMATED SVG BAR / PIE CHARTS (no recharts)
   ==================================================================== */
function BarsChart({ data }) {
  const max = Math.max(1, ...data.map(d => d.value));
  const W = 320, H = 200, P = { l:48, r:14, t:18, b:36 };
  const cw = W - P.l - P.r, ch = H - P.t - P.b;
  const bw = cw / data.length;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
    <g stroke="rgba(255,255,255,.08)" stroke-width="1">
      ${[0,.25,.5,.75,1].map(t => html`<line x1=${P.l} y1=${P.t+ch*t} x2=${W-P.r} y2=${P.t+ch*t}/>`)}
    </g>
    <g font-family="JetBrains Mono,monospace" font-size="9" fill="rgba(255,255,255,.55)">
      ${[0,.5,1].map(t => html`<text x=${P.l-6} y=${P.t+ch*(1-t)+3} text-anchor="end">${fmtIN(Math.round(max*t))}</text>`)}
    </g>
    ${data.map((d,i) => {
      const h = (d.value/max) * ch;
      const x = P.l + i*bw + bw*.18, y = P.t + ch - h, w = bw*.64;
      return html`<g key=${i}>
        <defs>
          <linearGradient id=${`bg-${i}`} x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color=${d.color2 || d.color}/>
            <stop offset="1" stop-color=${d.color}/>
          </linearGradient>
        </defs>
        <rect x=${x} y=${y} width=${w} height=${h} rx="3" fill=${`url(#bg-${i})`} opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur=".5s" begin=${i*.12+'s'} fill="freeze"/>
          <animate attributeName="height" from="0" to=${h} dur=".7s" begin=${i*.12+'s'} fill="freeze"/>
          <animate attributeName="y" from=${P.t+ch} to=${y} dur=".7s" begin=${i*.12+'s'} fill="freeze"/>
        </rect>
        <text x=${x+w/2} y=${y-6} text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="800" fill=${d.color2 || d.color} opacity="0">
          ${fmtIN(d.value)}
          <animate attributeName="opacity" from="0" to="1" dur=".4s" begin=${i*.12+.4+'s'} fill="freeze"/>
        </text>
        <text x=${x+w/2} y=${P.t+ch+18} text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#fff" letter-spacing=".5">${d.label}</text>
      </g>`;
    })}
  </svg>`;
}

function PieDonut({ data, size=190 }) {
  const total = data.reduce((s,d) => s+d.value, 0) || 1;
  const cx = size/2, cy = size/2, r = size*.42, ir = size*.26;
  let acc = 0;
  return html`<svg viewBox=${`0 0 ${size} ${size}`} preserveAspectRatio="xMidYMid meet">
    ${data.map((d,i) => {
      const a0 = (acc/total) * Math.PI * 2 - Math.PI/2;
      acc += d.value;
      const a1 = (acc/total) * Math.PI * 2 - Math.PI/2;
      const lf = (a1-a0) > Math.PI ? 1 : 0;
      const x0 = cx + Math.cos(a0)*r, y0 = cy + Math.sin(a0)*r;
      const x1 = cx + Math.cos(a1)*r, y1 = cy + Math.sin(a1)*r;
      const ix1 = cx + Math.cos(a1)*ir, iy1 = cy + Math.sin(a1)*ir;
      const ix0 = cx + Math.cos(a0)*ir, iy0 = cy + Math.sin(a0)*ir;
      const path = `M ${x0} ${y0} A ${r} ${r} 0 ${lf} 1 ${x1} ${y1} L ${ix1} ${iy1} A ${ir} ${ir} 0 ${lf} 0 ${ix0} ${iy0} Z`;
      const mid = (a0+a1)/2;
      const pct = Math.round((d.value/total)*100);
      const lx = cx + Math.cos(mid)*(r+ir)/2, ly = cy + Math.sin(mid)*(r+ir)/2;
      return html`<g key=${i}>
        <path d=${path} fill=${d.color} opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur=".5s" begin=${i*.15+'s'} fill="freeze"/>
        </path>
        ${pct > 4 ? html`<text x=${lx} y=${ly+3} text-anchor="middle" fill="#fff" font-family="Inter,sans-serif" font-size="11" font-weight="800" opacity="0">${pct}%
          <animate attributeName="opacity" from="0" to="1" dur=".4s" begin=${i*.15+.4+'s'} fill="freeze"/>
        </text>` : null}
      </g>`;
    })}
    <circle cx=${cx} cy=${cy} r=${ir-2} fill="#070b2a" stroke="rgba(255,255,255,.1)"/>
    <text x=${cx} y=${cy-2} text-anchor="middle" fill="rgba(255,255,255,.55)" font-family="Inter,sans-serif" font-size="9" font-weight="700" letter-spacing=".5">VOTE SHARE</text>
    <text x=${cx} y=${cy+12} text-anchor="middle" fill="#fbbf24" font-family="JetBrains Mono,monospace" font-size="13" font-weight="800">${fmtIN(total)}</text>
  </svg>`;
}

  return html`<div class="panel tally">

      ${['UDF','LDF','NDA','OTH']

        .map(({k,v,p}) => html`<div class="tally-row ${k===top && v>0 ? 'lead':''}" key=${k}>

      <span class="tally-tot-r">${pad2N(counted)} / ${pad2N(total)}</span>
    </div>
  </div>`;
}

/* ====================================================================
   COUNTING PROGRESS — compact card between SeatTally and AnalyticsFlash
   ==================================================================== */
function CountingProgress({ completedRounds, totalRoundsAll }) {
  const rndPct  = totalRoundsAll > 0 ? Math.min(100, (completedRounds / totalRoundsAll) * 100) : 0;
  return html`<div class="panel cprog">
    <div class="cprog-row">
      <div class="cprog-label-row">
        <span class="cprog-label">ROUND PROGRESS</span>
        <span class="cprog-val rnd">${completedRounds}/${totalRoundsAll} · ${rndPct.toFixed(0)}%</span>
      </div>
      <div class="cprog-track">
        <div class="cprog-fill rnds" style=${`width:${rndPct.toFixed(1)}%`}></div>

/* ====================================================================
   ANALYTICS FLASH (left, rotates) — Lead, Bars, Counting Progress (no donut/pie since vote share removed)
   ==================================================================== */
function AnalyticsFlash({ totals, totalLead, leadParty, segments, constituencies, candidates }) {
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  const per = 3;
  const lacRows = useMemo(() => constituencies.map(c => {
    const lead = leadFor(c.id, candidates);
    return { cons:c, leader:lead.leader, margin:lead.margin };
  }), [constituencies, candidates]);
  const pages = Math.max(1, Math.ceil(lacRows.length / per));
  useEffect(() => {
    if (paused || pages < 2) return;
    const t = setInterval(() => setIdx(i => (i+1)%pages), 6500);
    return () => clearInterval(t);
  }, [paused, pages]);
  const shown = lacRows.slice((idx%pages)*per, (idx%pages)*per + per);
  const pageLabels = Array.from({length:pages}, (_,i) => {
    const rows = lacRows.slice(i*per, i*per + per);
    return rows.map(r => r.cons.name_ml || r.cons.name_en).filter(Boolean).join(' / ') || `Analytics page ${i+1}`;
  });

  return html`<div class="panel afl">
    <div class="panel-h">
      <div class="panel-t">വിശകലനം · ANALYTICS</div>
      <${FlashControls} count=${pages} idx=${idx} paused=${paused} onToggle=${() => setPaused(p => !p)} onSeek=${setIdx} labels=${pageLabels}/>
    </div>
    <div class="afl-stage">
      <div class="afl-card afl-anim" key=${idx}>
        <div class="afl-poll">
          <div class="afl-poll-head">CONSTITUENCY LIVE STATUS</div>
          ${shown.map(r => {
            const party = r.leader?.party || 'OTH';
            const p = PARTIES[party];
            const rndDone = r.cons.completedRounds||r.cons.round||0;
            const rndTotal = r.cons.totalRounds||r.cons.total||15;
            const rndPct = Math.min(100, rndTotal > 0 ? (rndDone/rndTotal)*100 : 0).toFixed(0);
            const done = rndDone >= rndTotal || r.cons.countingStatus === 'completed' || r.cons.countingStatus === 'declared';
            const st = COUNTING_STATUSES.find(s=>s.val===(r.cons.countingStatus||'live'))||COUNTING_STATUSES[1];
            return html`<div class="afl-poll-row" key=${r.cons.id} style=${`border-left:3px solid ${p.color}`}>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
                <span class="afl-cons-line"><b>${r.cons.name_ml}</b><span class="afl-party-tag" style=${`--pc:${p.color}`}>${p.en}</span><span class="afl-status-tag" style=${`--sc:${st.color}`}>${st.short||st.en}</span></span>
                <b style=${`color:${p.color};font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;${st.val==='live'&&!done?'animation:blink 1s ease infinite':''}`}>+${fmtIN(r.margin)}</b>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <small class="afl-candidate-name">${r.leader?.name_ml || ''}</small>
                <span class="afl-round-count">R${rndDone}/${rndTotal}</span>
              </div>
              <div style="height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden">
                <div style=${`height:100%;width:${rndPct}%;background:${st.val==='live'?p.color:st.color};opacity:.8;border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1)`}></div>
              </div>
            </div>`;
          })}
        </div>
      </div>
    </div>
  </div>`;
}

/* Reusable circular progress ring */
function RingProgress({ pct=0, size=120, stroke=10, color='#22c55e', track='rgba(255,255,255,.06)' }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const dash = c * Math.min(100, Math.max(0, pct)) / 100;
  return html`<div class="ring-prog" style=${`width:${size}px;height:${size}px;position:relative;display:flex;align-items:center;justify-content:center`}>
    <svg width=${size} height=${size} viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke=${track} stroke-width=${stroke}/>
      <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke=${color} stroke-width=${stroke} stroke-linecap="round"
        stroke-dasharray=${`${dash} ${c-dash}`} style="transition:stroke-dasharray .8s cubic-bezier(.16,1,.3,1)"/>
    </svg>
    <div style=${`position:absolute;font-family:'JetBrains Mono',monospace;font-weight:900;font-size:${size/4.5}px;color:${color};letter-spacing:-1px`}>${pct.toFixed(1)}%</div>
  </div>`;
}

/* ====================================================================
   CONSTITUENCY STATUS (center-bottom) — all 13 sorted by lead desc
   shows top 3 candidates inline per constituency

function ConstituencyStatus({ candidates, constituencies, segments }) {
  const rows = useMemo(() => {
    const data = constituencies.map(c => {
      const cs = candidates.filter(k => k.consId === c.id).sort((a,b) => b.votes - a.votes);

      const totalCons = cs.reduce((s,x) => s + (x.votes||0), 0);
      return { cons:c, top3: cs.slice(0,3), margin, totalCons };
    });
    return data.sort((a,b) => b.margin - a.margin);
  }, [candidates, constituencies]);
  const curRound = Math.max(...segments.filter(s => !s.postal && s.id !== 'pos' && s.id !== 'postal').map(s => s.round || 0), 0);
  return html`<div class="panel cstat">
    <div class="panel-h">
      <div class="panel-t">മണ്ഡലം തിരിച്ചുള്ള സ്ഥിതി · CONSTITUENCY STATUS</div>

        <span style="font-family:'Inter',sans-serif;font-size:9.5px;color:rgba(255,255,255,.45);letter-spacing:1.5px">SORT BY LEAD ↓</span>

            <th style="width:140px">മണ്ഡലം</th>

            <th>3rd</th>

            <th class="num" style="width:60px">റൗണ്ട്</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r,i) => {
            return html`<tr key=${r.cons.id} class=${`rank-${i<3?'top':'reg'}`}>
              <td class="rank">${i<3?html`<span class="rank-medal rank-${i+1}">${i+1}</span>`:pad2N(i+1)}</td>
              <td class="cons-cell">
                <div class="cons-ml">${r.cons.name_ml}</div>
                <div class="cons-en">${r.cons.name_en}</div>
              </td>
              ${[0,1,2].map(j => {
                const c = r.top3[j];
                if (!c) return html`<td class="cand-mini empty">—</td>`;
                const partyColor = PARTIES[c.party]?.color || '#94a3b8';
                const isLeader = j === 0;
                return html`<td class=${`cand-mini ${isLeader?'is-lead':''}`} key=${j}>
                  <div class="cand-mini-flex" style=${`--pc:${partyColor}`}>
                    <${Avatar} size=${28} party=${c.party} seed=${c.photoSeed||c.id||'x'} ring=${false} photoUrl=${c.photoUrl||''}/>
                    <div class="cand-mini-text">
                      <div class="cand-mini-name">${c.name_ml || c.name}</div>
                      <div class="cand-mini-meta">
                        <span class=${`pty-mini ${c.party.toLowerCase()}`}>${c.party}</span>
